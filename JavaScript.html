<script>
(function () {
  'use strict';

  const STORAGE_TOKEN_KEY = 'bpm_session_token_v1';
  const MONTH_NAMES_SHORT = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  const STATE = {
    token: localStorage.getItem(STORAGE_TOKEN_KEY) || '',
    user: null,
    boot: null,
    activeTab: '',
    entryMode: 'Time',
    billingSubtab: 'unbilled',
    settingsSubtab: 'company',
    workOrders: [],
    workLogs: [],
    expenses: [],
    myPaystubs: [],
    adminOverview: null,
    billingData: null,
    rentData: null,
    payrollData: null,
    trendChart: null,
    tenantPhotos: [],
    previewDoc: null,
    bulkParsedRows: [],
    byId: {
      wo: {},
      log: {},
      exp: {},
      inv: {},
      lease: {},
      tenant: {},
      owner: {},
      prop: {},
      task: {},
      emp: {},
      rate: {},
      worker: {}
    }
  };

  // =========================================================================
  // CORE UTILITIES & API BRIDGE
  // =========================================================================

  function esc(val) {
    return String(val === null || val === undefined ? '' : val)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function fmtMoney(v) {
    const n = Number(v || 0);
    const abs = Math.abs(isFinite(n) ? n : 0).toLocaleString('en-US', {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });
    return n < 0 ? '-$' + abs : '$' + abs;
  }

  function todayYmd() {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + day;
  }

  function showToast(msg, type) {
    const stack = document.getElementById('toast-container');
    if (!stack) return;
    const colors = {
      success: 'bg-emerald-700 text-white',
      error: 'bg-red-700 text-white',
      info: 'bg-slate-800 text-white',
      warn: 'bg-amber-600 text-white'
    };
    const el = document.createElement('div');
    el.className = 'pointer-events-auto rounded-xl px-4 py-3 text-xs font-semibold shadow-lg flex items-center justify-between gap-2 ' + (colors[type] || colors.info);
    el.innerHTML = '<span>' + esc(msg) + '</span><button type="button" class="opacity-80 hover:opacity-100">&times;</button>';
    el.querySelector('button').addEventListener('click', function () { el.remove(); });
    stack.appendChild(el);
    setTimeout(function () { if (el.parentNode) el.remove(); }, 4200);
  }

  function setLoading(isBusy, label) {
    const el = document.getElementById('global-loader');
    const txt = document.getElementById('loader-text');
    if (!el) return;
    if (isBusy) {
      if (txt) txt.textContent = label || 'Working...';
      el.classList.remove('hidden');
    } else {
      el.classList.add('hidden');
    }
  }

  function apiCall(fnName) {
    const args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      if (window.BPM_BOOT && window.BPM_BOOT.isAppsScript && window.google && window.google.script && window.google.script.run) {
        const runner = window.google.script.run
          .withSuccessHandler(function (res) { resolve(res); })
          .withFailureHandler(function (err) {
            const msg = (err && err.message) ? err.message : String(err || 'Server error');
            if (msg.indexOf('AUTH_REQUIRED') !== -1) {
              handleSessionInvalid();
            }
            reject(new Error(msg));
          });
        if (typeof runner[fnName] === 'function') {
          runner[fnName].apply(runner, args);
        } else {
          reject(new Error('Unknown server method: ' + fnName));
        }
      } else {
        setTimeout(function () {
          try {
            if (typeof MOCK_API[fnName] !== 'function') {
              throw new Error('Mock method missing: ' + fnName);
            }
            const res = MOCK_API[fnName].apply(null, args);
            resolve(JSON.parse(JSON.stringify(res)));
          } catch (err) {
            reject(err);
          }
        }, 60);
      }
    });
  }

  function compressImageFile(file) {
    return new Promise(function (resolve, reject) {
      const reader = new FileReader();
      reader.onload = function (ev) {
        const img = new Image();
        img.onload = function () {
          const maxDim = 1280;
          let w = img.width;
          let h = img.height;
          if (w > maxDim || h > maxDim) {
            if (w >= h) { h = Math.round(h * maxDim / w); w = maxDim; }
            else { w = Math.round(w * maxDim / h); h = maxDim; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          resolve({
            name: file.name,
            mimeType: 'image/jpeg',
            dataUrl: canvas.toDataURL('image/jpeg', 0.78)
          });
        };
        img.onerror = function () { reject(new Error('Invalid image file')); };
        img.src = ev.target.result;
      };
      reader.onerror = function () { reject(new Error('Unable to read file')); };
      reader.readAsDataURL(file);
    });
  }

  function downloadBase64File(base64, filename, mimeType) {
    if (!base64) {
      showToast('Print preview opened. Use browser Print -> Save as PDF if no file blob exists.', 'info');
      window.print();
      return;
    }
    const bin = atob(base64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const blob = new Blob([bytes], { type: mimeType || 'application/pdf' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename || 'document.pdf';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  }

  function badgeClassForStatus(status) {
    const map = {
      New: 'bg-red-100 text-red-800',
      Emergency: 'bg-red-600 text-white',
      Urgent: 'bg-amber-500 text-white',
      Normal: 'bg-slate-200 text-slate-800',
      Assigned: 'bg-blue-100 text-blue-800',
      'In Progress': 'bg-indigo-100 text-indigo-800',
      'Waiting Parts': 'bg-amber-100 text-amber-800',
      Completed: 'bg-emerald-100 text-emerald-800',
      Billed: 'bg-teal-100 text-teal-800',
      Pending: 'bg-amber-100 text-amber-800',
      Approved: 'bg-emerald-100 text-emerald-800',
      Paid: 'bg-blue-100 text-blue-800',
      Unbilled: 'bg-amber-100 text-amber-800',
      'Draft Invoice': 'bg-slate-200 text-slate-700',
      Draft: 'bg-slate-200 text-slate-800',
      Invoiced: 'bg-indigo-100 text-indigo-800',
      Sent: 'bg-indigo-100 text-indigo-800',
      Partial: 'bg-amber-100 text-amber-800',
      Overdue: 'bg-red-100 text-red-800',
      Void: 'bg-slate-100 text-slate-400 line-through',
      'Internal/Non-Billable': 'bg-slate-100 text-slate-600',
      'N/A': 'bg-slate-100 text-slate-500'
    };
    return map[status] || 'bg-slate-100 text-slate-700';
  }

  // =========================================================================
  // BOOTSTRAP & AUTHENTICATION
  // =========================================================================

  function showShell(shellId) {
    ['tenant-portal-shell', 'auth-shell', 'app-shell'].forEach(function (id) {
      const el = document.getElementById(id);
      if (el) el.classList.toggle('hidden', id !== shellId);
    });
  }

  function handleSessionInvalid() {
    STATE.token = '';
    STATE.user = null;
    localStorage.removeItem(STORAGE_TOKEN_KEY);
    showShell('auth-shell');
  }

  async function initApp() {
    const urlParams = new URLSearchParams(window.location.search || '');
    const viewParam = String(urlParams.get('view') || '').toLowerCase();
    const isTenantPortal =
      (window.BPM_BOOT && window.BPM_BOOT.initialView === 'request') ||
      viewParam === 'request' ||
      viewParam === 'intake';

    if (isTenantPortal) {
      await loadTenantPortal();
      return;
    }

    if (!window.BPM_BOOT || !window.BPM_BOOT.isAppsScript) {
      const devBar = document.getElementById('dev-preview-bar');
      if (devBar) devBar.classList.remove('hidden');
    }

    setLoading(true, 'Connecting to BPM...');
    try {
      const res = await apiCall('bootstrapApp', STATE.token);
      if (res && res.authenticated) {
        onAuthenticated(res);
      } else {
        const compEl = document.getElementById('auth-company-name');
        if (compEl && res && res.companyName) compEl.textContent = res.companyName;
        showShell('auth-shell');
      }
    } catch (err) {
      showShell('auth-shell');
      showToast(err.message, 'error');
    } finally {
      setLoading(false);
    }
  }

  function onAuthenticated(res) {
    STATE.token = res.token || '';
    if (STATE.token) localStorage.setItem(STORAGE_TOKEN_KEY, STATE.token);
    STATE.user = res.user;
    STATE.boot = res.bootstrapData;

    const s = (STATE.boot && STATE.boot.settings) || {};
    document.getElementById('nav-company-name').textContent = s.COMPANY_NAME || 'Butler Property Management';
    document.getElementById('nav-user-name').textContent = STATE.user.name;
    document.getElementById('nav-user-role').textContent = STATE.user.role;

    const isAdmin = STATE.user.role === 'Owner' || STATE.user.role === 'Admin';
    document.getElementById('btn-copy-tenant-link').classList.toggle('hidden', !isAdmin);

    indexMasterData();
    buildNavigationTabs();
    populateWorkEntryFormOptions();
    showShell('app-shell');

    if (res.needsPinSetup) {
      document.getElementById('auth-set-pin-panel').classList.remove('hidden');
      showShell('auth-shell');
      return;
    }

    const defaultTab = isAdmin ? 'dashboard' : 'work-orders';
    switchTab(defaultTab);
  }

  function indexMasterData() {
    STATE.byId.owner = {};
    STATE.byId.prop = {};
    STATE.byId.task = {};
    STATE.byId.emp = {};
    STATE.byId.rate = {};
    const b = STATE.boot || {};
    (b.owners || []).forEach(function (o) { STATE.byId.owner[o.Owner_ID] = o; });
    (b.allProperties || b.properties || []).forEach(function (p) { STATE.byId.prop[p.Property_ID] = p; });
    (b.allTasks || b.tasks || []).forEach(function (t) { STATE.byId.task[t.Task_ID] = t; });
    (b.employees || []).forEach(function (e) { STATE.byId.emp[e.Employee_ID] = e; });
    (b.billingRates || []).forEach(function (r) { STATE.byId.rate[r.Rate_ID] = r; });
  }

  // =========================================================================
  // TENANT PORTAL (?view=request)
  // =========================================================================

  async function loadTenantPortal() {
    showShell('tenant-portal-shell');
    setLoading(true, 'Loading maintenance portal...');
    try {
      const data = await apiCall('getTenantPortalBootstrap');
      document.getElementById('tp-company-name').textContent = data.companyName || 'Butler Property Management';
      document.getElementById('tp-company-phone').textContent = data.companyPhone || '(317) 432-0054';

      const propSel = document.getElementById('tp-property');
      propSel.innerHTML = '<option value="">Select your property...</option>' +
        (data.properties || []).map(function (p) {
          return '<option value="' + esc(p.propertyId) + '">' + esc(p.propertyName) +
            (p.address ? ' (' + esc(p.address) + ')' : '') + '</option>';
        }).join('');

      const catSel = document.getElementById('tp-category');
      catSel.innerHTML = (data.categories || []).map(function (c) {
        return '<option value="' + esc(c) + '">' + esc(c) + '</option>';
      }).join('');
    } catch (err) {
      showToast('Unable to load property list: ' + err.message, 'error');
    } finally {
      setLoading(false);
    }
  }

  async function handleTenantPhotoSelection(files) {
    STATE.tenantPhotos = [];
    const preview = document.getElementById('tp-photo-previews');
    preview.innerHTML = '';
    const slice = Array.prototype.slice.call(files || [], 0, 3);
    for (let i = 0; i < slice.length; i++) {
      try {
        const compressed = await compressImageFile(slice[i]);
        STATE.tenantPhotos.push(compressed);
        const img = document.createElement('img');
        img.src = compressed.dataUrl;
        img.className = 'w-16 h-16 object-cover rounded-lg border border-slate-300';
        preview.appendChild(img);
      } catch (e) {
        showToast('Skipped invalid image file.', 'warn');
      }
    }
  }

  async function handleTenantFormSubmit(e) {
    e.preventDefault();
    const urgencyEl = document.querySelector('input[name="tp-urgency"]:checked');
    const payload = {
      propertyId: document.getElementById('tp-property').value,
      unitRoom: document.getElementById('tp-unit').value,
      requesterName: document.getElementById('tp-name').value,
      requesterPhone: document.getElementById('tp-phone').value,
      requesterEmail: document.getElementById('tp-email').value,
      taskCategory: document.getElementById('tp-category').value,
      permissionToEnter: document.getElementById('tp-permission').value,
      urgency: urgencyEl ? urgencyEl.value : 'Normal',
      description: document.getElementById('tp-description').value,
      photos: STATE.tenantPhotos
    };
    setLoading(true, 'Sending request to dispatch...');
    try {
      const res = await apiCall('submitTenantRequest', payload);
      document.getElementById('tp-ticket-id').textContent = res.woId;
      document.getElementById('tp-success-prop').textContent = res.propertyName;
      document.getElementById('tenant-request-form').classList.add('hidden');
      document.getElementById('tp-success-card').classList.remove('hidden');
      showToast('Ticket ' + res.woId + ' submitted!', 'success');
    } catch (err) {
      showToast(err.message, 'error');
    } finally {
      setLoading(false);
    }
  }

  // =========================================================================
  // NAVIGATION & TAB ROUTING
  // =========================================================================

  function buildNavigationTabs() {
    const isAdmin = STATE.user && (STATE.user.role === 'Owner' || STATE.user.role === 'Admin');
    const woBadge = (STATE.boot && STATE.boot.openWorkOrdersCount)
      ? ' <span class="ml-1 px-1.5 py-0.5 rounded-full bg-blue-100 text-blue-800 text-[10px]">' + STATE.boot.openWorkOrdersCount + '</span>'
      : '';

    const tabs = isAdmin ? [
      { id: 'dashboard', icon: 'fa-chart-pie', label: 'Dashboard' },
      { id: 'work-orders', icon: 'fa-clipboard-list', label: 'Work Orders' + woBadge },
      { id: 'time-expenses', icon: 'fa-clock', label: 'Time & Expenses' },
      { id: 'billing', icon: 'fa-file-invoice-dollar', label: 'Billing & Invoices' },
      { id: 'rentals', icon: 'fa-house-user', label: 'Rentals & Leases' },
      { id: 'payroll', icon: 'fa-money-check-alt', label: 'Payroll' },
      { id: 'settings', icon: 'fa-cog', label: 'Settings' }
    ] : [
      { id: 'work-orders', icon: 'fa-clipboard-list', label: 'My Work Orders' + woBadge },
      { id: 'time-expenses', icon: 'fa-clock', label: 'Log Time / Receipt & History' }
    ];

    const nav = document.getElementById('main-nav-tabs');
    nav.innerHTML = tabs.map(function (t) {
      return '<button type="button" data-action="nav-tab" data-tab="' + t.id + '" class="nav-tab-btn px-2.5 py-1.5 rounded-lg text-slate-600 hover:bg-slate-100 flex items-center gap-1.5 whitespace-nowrap">' +
        '<i class="fas ' + t.icon + '"></i><span>' + t.label + '</span></button>';
    }).join('');
  }

  function switchTab(tabId) {
    STATE.activeTab = tabId;
    const views = ['dashboard', 'work-orders', 'time-expenses', 'billing', 'rentals', 'payroll', 'settings'];
    views.forEach(function (v) {
      const el = document.getElementById('view-' + v);
      if (el) el.classList.toggle('hidden', v !== tabId);
    });
    document.querySelectorAll('.nav-tab-btn').forEach(function (btn) {
      const active = btn.getAttribute('data-tab') === tabId;
      btn.className = 'nav-tab-btn px-2.5 py-1.5 rounded-lg flex items-center gap-1.5 whitespace-nowrap ' +
        (active ? 'bg-blue-700 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-100');
    });

    if (tabId === 'dashboard') loadAdminDashboard();
    else if (tabId === 'work-orders') loadWorkOrders();
    else if (tabId === 'time-expenses') loadTimeAndExpenses();
    else if (tabId === 'billing') loadBillingView();
    else if (tabId === 'rentals') loadRentalsView();
    else if (tabId === 'payroll') loadPayrollView();
    else if (tabId === 'settings') renderSettingsView();
  }

  // =========================================================================
  // DASHBOARD ("NOTHING MISSED")
  // =========================================================================

  async function loadAdminDashboard() {
    try {
      const data = await apiCall('getAdminOverview', STATE.token);
      STATE.adminOverview = data;
      renderDashboard(data);
    } catch (err) {
      showToast('Failed to load dashboard: ' + err.message, 'error');
    }
  }

  function renderDashboard(data) {
    const alertsEl = document.getElementById('dash-alerts');
    const sevColors = {
      red: 'bg-red-50 border-red-200 text-red-900 hover:bg-red-100',
      amber: 'bg-amber-50 border-amber-200 text-amber-900 hover:bg-amber-100',
      blue: 'bg-blue-50 border-blue-200 text-blue-900 hover:bg-blue-100',
      emerald: 'bg-emerald-50 border-emerald-200 text-emerald-900 hover:bg-emerald-100'
    };
    const alerts = data.alerts || [];
    alertsEl.innerHTML = alerts.length > 0
      ? alerts.map(function (a) {
          return '<button type="button" data-action="nav-tab" data-tab="' + esc(a.tab) + '" class="text-left border rounded-xl p-3.5 transition ' + (sevColors[a.severity] || sevColors.blue) + '">' +
            '<div class="text-xs font-bold">' + esc(a.title) + '</div>' +
            '<div class="text-[11px] opacity-80 mt-0.5">' + esc(a.detail) + '</div></button>';
        }).join('')
      : '<div class="md:col-span-3 bpm-card p-3.5 text-xs text-emerald-700 font-semibold flex items-center gap-2"><i class="fas fa-check-circle"></i> All clear — nothing unbilled, overdue, or waiting approval right now.</div>';

    const k = data.kpis || {};
    const kpiCards = [
      { label: 'Unbilled Ready', val: fmtMoney(k.unbilledTotal), sub: (k.unbilledLogCount || 0) + ' logs, ' + (k.unbilledExpenseCount || 0) + ' exp', color: 'text-emerald-700' },
      { label: 'Open Work Orders', val: k.openWoCount || 0, sub: (k.emergencyWoCount || 0) + ' emergency', color: 'text-blue-700' },
      { label: 'Pending Approval', val: k.pendingApprovalCount || 0, sub: 'Hours & receipts', color: 'text-amber-700' },
      { label: 'Overdue Invoices', val: fmtMoney(k.overdueInvoiceTotal), sub: (k.overdueInvoiceCount || 0) + ' overdue', color: 'text-red-700' },
      { label: 'Outstanding A/R', val: fmtMoney(k.outstandingReceivables), sub: 'All unpaid invoices', color: 'text-slate-900' },
      { label: 'Month Rent Collected', val: fmtMoney(k.currentMonthRentCollected), sub: 'of ' + fmtMoney(k.currentMonthRentExpected) + ' sched', color: 'text-indigo-700' }
    ];
    document.getElementById('dash-kpis').innerHTML = kpiCards.map(function (c) {
      return '<div class="bpm-card p-3.5"><div class="text-[11px] font-semibold text-slate-500">' + esc(c.label) + '</div>' +
        '<div class="text-xl font-extrabold mt-1 ' + c.color + '">' + esc(c.val) + '</div>' +
        '<div class="text-[11px] text-slate-400 mt-0.5">' + esc(c.sub) + '</div></div>';
    }).join('');

    // Recent Logs
    const recEl = document.getElementById('dash-recent-logs');
    const logs = data.recentLogs || [];
    recEl.innerHTML = logs.length === 0
      ? '<p class="text-slate-400 py-4 text-center">No recent field logs yet.</p>'
      : logs.map(function (l) {
          return '<div class="border border-slate-100 rounded-lg p-2.5 flex justify-between items-center gap-2">' +
            '<div class="min-w-0"><div class="font-semibold text-slate-800 truncate">' + esc(l.Property_Name) + ' &bull; ' + esc(l.Task_Name) + '</div>' +
            '<div class="text-[11px] text-slate-500">' + esc(l.Work_Date) + ' &bull; ' + esc(l.Employee_Name) + ' (' + esc(l.Hours) + 'h)</div></div>' +
            '<span class="badge-pill ' + badgeClassForStatus(l.Billing_Status) + '">' + esc(l.Billing_Status) + '</span></div>';
        }).join('');

    // Trend Chart
    if (typeof Chart !== 'undefined') {
      const ctx = document.getElementById('dash-trend-chart');
      if (ctx) {
        if (STATE.trendChart) {
          STATE.trendChart.destroy();
          STATE.trendChart = null;
        }
        const trend = data.monthlyTrend || [];
        STATE.trendChart = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: trend.map(function (t) { return t.label; }),
            datasets: [
              { label: 'Invoices Billed', data: trend.map(function (t) { return t.billedRevenue; }), backgroundColor: '#1d4ed8' },
              { label: 'Rent Collected', data: trend.map(function (t) { return t.rentCollected; }), backgroundColor: '#059669' },
              { label: 'Payroll Paid', data: trend.map(function (t) { return t.payrollCost; }), backgroundColor: '#f59e0b' }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } } },
            scales: { y: { beginAtZero: true } }
          }
        });
      }
    }
  }

  // =========================================================================
  // WORK ORDERS & DISPATCH
  // =========================================================================

  async function loadWorkOrders() {
    const isAdmin = STATE.user && (STATE.user.role === 'Owner' || STATE.user.role === 'Admin');
    document.getElementById('wo-new-btn').classList.toggle('hidden', !isAdmin);
    try {
      const rows = await apiCall('getWorkOrders', STATE.token, {
        status: document.getElementById('wo-filter-status').value,
        urgency: document.getElementById('wo-filter-urgency').value
      });
      STATE.workOrders = rows || [];
      STATE.byId.wo = {};
      STATE.workOrders.forEach(function (w) { STATE.byId.wo[w.WO_ID] = w; });
      renderWorkOrdersList();
      refreshWoDropdownInTimeForm();
    } catch (err) {
      showToast(err.message, 'error');
    }
  }

  function renderWorkOrdersList() {
    const q = String(document.getElementById('wo-filter-search').value || '').toLowerCase();
    const isAdmin = STATE.user && (STATE.user.role === 'Owner' || STATE.user.role === 'Admin');
    const filtered = STATE.workOrders.filter(function (w) {
      if (!q) return true;
      return (
        String(w.WO_ID || '').toLowerCase().indexOf(q) !== -1 ||
        String(w.Property_Name || '').toLowerCase().indexOf(q) !== -1 ||
        String(w.Description || '').toLowerCase().indexOf(q) !== -1 ||
        String(w.Requester_Name || '').toLowerCase().indexOf(q) !== -1
      );
    });

    const el = document.getElementById('wo-list-container');
    if (filtered.length === 0) {
      el.innerHTML = '<div class="bpm-card p-8 text-center text-xs text-slate-400">No work orders match the selected filter.</div>';
      return;
    }

    el.innerHTML = filtered.map(function (w) {
      const photos = String(w.Photo_URLs || '').split('\n').filter(Boolean);
      const photoHtml = photos.length > 0
        ? '<div class="flex gap-2 mt-2">' + photos.map(function (u, idx) {
            return '<a href="' + esc(u) + '" target="_blank" rel="noopener" class="text-[11px] font-semibold text-blue-700 hover:underline"><i class="fas fa-camera mr-1"></i>Photo ' + (idx + 1) + '</a>';
          }).join('') + '</div>'
        : '';
      return '<div class="bpm-card p-4 flex flex-col md:flex-row md:items-center justify-between gap-3">' +

  function refreshWoDropdownInTimeForm() {
    const sel = document.getElementById('we-wo');
    if (!sel) return;
    const open = (STATE.workOrders || []).filter(function (w) {
      return ['Completed', 'Billed', 'Cancelled'].indexOf(w.Status) === -1;
    });
    const cur = sel.value;
    sel.innerHTML = '<option value="">— No Work Order (Ad-Hoc) —</option>' + open.map(function (w) {
      return '<option value="' + esc(w.WO_ID) + '">' + esc(w.WO_ID + ' — ' + w.Property_Name + ': ' + w.Task_Category) + '</option>';
    }).join('');
    if (cur) sel.value = cur;
    document.getElementById('we-complete-wo-wrap').classList.toggle('hidden', !sel.value);
  }

  function setEntryMode(mode) {
    STATE.entryMode = mode;
    document.querySelectorAll('#we-mode-tabs button').forEach(function (btn) {
      const active = btn.getAttribute('data-mode') === mode;
      btn.className = 'px-3 py-1.5 rounded-md ' + (active ? 'bg-white shadow-sm text-slate-900' : 'text-slate-600');
    });
    document.getElementById('we-time-fields').classList.toggle('hidden', mode !== 'Time');
    document.getElementById('we-flat-pay-group').classList.toggle('hidden', mode !== 'Flat');
    const hrsEl = document.getElementById('we-hours');
    if (mode === 'Expense Only') {
      hrsEl.value = '0';
      if (document.getElementById('we-materials-list').children.length === 0) {
        addMaterialLine();
      }
    } else if (Number(hrsEl.value || 0) === 0) {
      hrsEl.value = '1';
    }
  }

  function addMaterialLine() {
    const list = document.getElementById('we-materials-list');
    const row = document.createElement('div');
    row.className = 'we-mat-row grid grid-cols-1 sm:grid-cols-6 gap-2 bg-white p-2.5 rounded-lg border border-slate-200 items-end';
    row.innerHTML =
      '<div><label class="block text-[10px] font-semibold text-slate-500">Vendor</label><input type="text" name="vendor" placeholder="Home Depot" class="w-full rounded border border-slate-300 px-2 py-1.5 text-xs" /></div>' +
      '<div class="sm:col-span-2"><label class="block text-[10px] font-semibold text-slate-500">Item Description *</label><input type="text" name="desc" required placeholder="PVC elbow & wax ring" class="w-full rounded border border-slate-300 px-2 py-1.5 text-xs" /></div>' +
      '<div><label class="block text-[10px] font-semibold text-slate-500">Total Cost ($) *</label><input type="number" step="0.01" min="0" name="cost" required placeholder="24.95" class="w-full rounded border border-slate-300 px-2 py-1.5 text-xs font-semibold" /></div>' +
      '<div><label class="block text-[10px] font-semibold text-slate-500">Paid By</label><select name="paidBy" class="w-full rounded border border-slate-300 px-2 py-1.5 text-xs bg-white">' +

      '<option value="Employee Out-of-Pocket">Employee Out-of-Pocket</option></select></div>' +
      '<div class="flex items-center gap-1.5">' +
      '<label class="flex-1 text-[10px] bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold px-2 py-1.5 rounded text-center cursor-pointer truncate">' +
      '<i class="fas fa-camera mr-1"></i><span>Receipt</span><input type="file" accept="image/*" class="hidden we-mat-file" /></label>' +
      '<button type="button" class="text-red-500 hover:text-red-700 px-2 py-1.5 text-xs font-bold we-mat-remove">&times;</button></div>';

    const fileInput = row.querySelector('.we-mat-file');
    fileInput.addEventListener('change', async function () {
      if (fileInput.files && fileInput.files[0]) {
        const comp = await compressImageFile(fileInput.files[0]);
        row.dataset.receiptDataUrl = comp.dataUrl;
        row.dataset.receiptFileName = comp.name;
        row.querySelector('label span').textContent = 'Attached';
      }
    });
    row.querySelector('.we-mat-remove').addEventListener('click', function () { row.remove(); });
    list.appendChild(row);
  }

  async function handleWorkEntrySubmit(e) {
    e.preventDefault();
    const materials = [];
    document.querySelectorAll('#we-materials-list .we-mat-row').forEach(function (r) {
      const desc = r.querySelector('[name="desc"]').value.trim();
      const cost = r.querySelector('[name="cost"]').value;
      if (!desc && !cost) return;
      materials.push({
        vendor: r.querySelector('[name="vendor"]').value,
        itemDescription: desc || 'Materials',
        quantity: 1,
        unitCost: cost,
        totalCost: cost,
        paidBy: r.querySelector('[name="paidBy"]').value,
        receiptDataUrl: r.dataset.receiptDataUrl || '',
        receiptFileName: r.dataset.receiptFileName || ''
      });
    });

    const isAdmin = STATE.user && (STATE.user.role === 'Owner' || STATE.user.role === 'Admin');
    const payload = {
      workType: STATE.entryMode,
      employeeId: document.getElementById('we-employee').value,
      propertyId: document.getElementById('we-property').value,
      woId: document.getElementById('we-wo').value,
      workDate: document.getElementById('we-date').value,
      taskName: document.getElementById('we-task').value,
      hours: STATE.entryMode === 'Expense Only' ? 0 : (STATE.entryMode === 'Flat' ? 1 : document.getElementById('we-hours').value),
      startTime: document.getElementById('we-start-time').value,
      endTime: document.getElementById('we-end-time').value,
      flatPayAmount: document.getElementById('we-flat-pay').value,
      chargeTarget: document.getElementById('we-charge-target').value,
      customCharge: isAdmin ? document.getElementById('we-custom-charge').value : '',
      notes: document.getElementById('we-notes').value,
      markWoCompleted: document.getElementById('we-complete-wo').checked,
      materials: materials,
      autoApprove: isAdmin && document.getElementById('we-employee').value === STATE.user.employeeId
    };

    setLoading(true, 'Recording work entry...');
    try {
      await apiCall('submitWorkEntry', STATE.token, payload);
      document.getElementById('we-notes').value = '';
      document.getElementById('we-custom-charge').value = '';
      document.getElementById('we-materials-list').innerHTML = '';
      document.getElementById('we-complete-wo').checked = false;
      showToast('Work / expense entry saved!', 'success');
      await loadTimeAndExpenses();
    } catch (err) {
      showToast(err.message, 'error');
    } finally {
      setLoading(false);
    }
  }

  async function loadTimeAndExpenses() {
    try {
      const isAdmin = STATE.user && (STATE.user.role === 'Owner' || STATE.user.role === 'Admin');
      if (STATE.workOrders.length === 0) {
        const wos = await apiCall('getWorkOrders', STATE.token, { status: 'Open' });
        STATE.workOrders = wos || [];
        refreshWoDropdownInTimeForm();
      }
      const res = await apiCall('getWorkLogsAndExpenses', STATE.token, {
        payrollStatus: document.getElementById('we-filter-status').value,
        billingStatus: document.getElementById('we-filter-billing').value,
        employeeId: isAdmin ? document.getElementById('we-filter-emp').value : '',
        propertyId: document.getElementById('we-filter-prop').value
      });
      STATE.workLogs = res.workLogs || [];
      STATE.expenses = res.expenses || [];
      STATE.byId.log = {};
      STATE.byId.exp = {};
      STATE.workLogs.forEach(function (l) { STATE.byId.log[l.Log_ID] = l; });
      STATE.expenses.forEach(function (ex) { STATE.byId.exp[ex.Expense_ID] = ex; });
      renderTimeAndExpensesTable();

      if (!isAdmin) {
        const my = await apiCall('getMyPortalData', STATE.token);
        STATE.myPaystubs = my.paystubs || [];
        renderCrewPaystubs();
      }
    } catch (err) {
      showToast(err.message, 'error');
    }
  }

  async function approveSelectedEntries() {
    const logIds = Array.prototype.map.call(document.querySelectorAll('.we-check-log:checked'), function (c) { return c.value; });
    const expIds = Array.prototype.map.call(document.querySelectorAll('.we-check-exp:checked'), function (c) { return c.value; });
    if (logIds.length === 0 && expIds.length === 0) {
      showToast('Select at least one pending entry to approve.', 'warn');
      return;
    }
    setLoading(true, 'Approving selected entries...');
    try {
      await apiCall('batchApproveItems', STATE.token, { logIds: logIds, expenseIds: expIds, status: 'Approved' });
      showToast('Approved selected entries!', 'success');
      await loadTimeAndExpenses();
    } catch (err) {
      showToast(err.message, 'error');
    } finally {
      setLoading(false);
    }
  }

  // =========================================================================
  // BILLING, INVOICES & OWNER SETTLEMENTS

  function switchBillingSubtab(subtab) {
    STATE.billingSubtab = subtab;
    ['unbilled', 'invoices', 'payments'].forEach(function (st) {
      document.getElementById('billing-' + st + '-panel').classList.toggle('hidden', st !== subtab);
    });
    document.querySelectorAll('#billing-subtabs button').forEach(function (b) {
      const active = b.getAttribute('data-subtab') === subtab;
      b.className = 'px-4 py-2 rounded-lg text-xs font-bold ' +
        (active ? 'bg-blue-700 text-white' : 'bg-white border border-slate-300 text-slate-700');
    });
  }

  async function loadBillingView() {
    try {
      const data = await apiCall('getBillingDashboard', STATE.token);
      STATE.billingData = data;
      STATE.byId.inv = {};
      (data.invoices || []).forEach(function (inv) { STATE.byId.inv[inv.Invoice_ID] = inv; });
      renderUnbilledPipeline();
      renderInvoicesList();
      renderPaymentsLedger();
    } catch (err) {
      showToast(err.message, 'error');
    }
  }

    const groups = (STATE.billingData && STATE.billingData.unbilledByOwner) || [];
    const el = document.getElementById('billing-unbilled-container');
    if (groups.length === 0) {
      el.innerHTML = '<div class="bpm-card p-8 text-center text-xs text-slate-400">Everything billable has already been invoiced.</div>';
      return;
    }

    el.innerHTML = groups.map(function (owner) {
      const propCards = owner.propertyList.map(function (p) {
        const itemsHtml = p.laborItems.map(function (l) {
          return '<label class="flex items-center justify-between gap-2 py-1.5 border-b border-slate-100 text-xs cursor-pointer">' +
            '<span class="flex items-center gap-2 min-w-0"><input type="checkbox" class="inv-pick-log" data-owner="' + esc(owner.ownerId) + '" data-prop="' + esc(p.propertyId) + '" value="' + esc(l.Log_ID) + '" checked />' +
            '<span class="truncate"><strong>' + esc(l.Work_Date) + '</strong> &bull; ' + esc(l.Task_Name) + ' (' + esc(l.Hours) + 'h, ' + esc(l.Employee_Name) + ')' +
            (l.Payroll_Status === 'Pending' ? ' <span class="badge-pill bg-amber-100 text-amber-800">Unapproved</span>' : '') + '</span></span>' +
            '<span class="font-bold text-slate-900 shrink-0">' + fmtMoney(l.Effective_Billable) + '</span></label>';
        }).join('') + p.materialItems.map(function (e) {
          return '<label class="flex items-center justify-between gap-2 py-1.5 border-b border-slate-100 text-xs cursor-pointer">' +
            '<span class="flex items-center gap-2 min-w-0"><input type="checkbox" class="inv-pick-exp" data-owner="' + esc(owner.ownerId) + '" data-prop="' + esc(p.propertyId) + '" value="' + esc(e.Expense_ID) + '" checked />' +
            '<span class="truncate"><i class="fas fa-receipt text-amber-600 mr-1"></i><strong>' + esc(e.Expense_Date) + '</strong> &bull; ' + esc((e.Vendor ? e.Vendor + ': ' : '') + e.Item_Description) + '</span></span>' +
            '<span class="font-bold text-slate-900 shrink-0">' + fmtMoney(e.Billable_Amount) + '</span></label>';
        }).join('');

        return '<div class="border border-slate-200 rounded-xl p-3.5 bg-slate-50/70 space-y-2">' +
          '<div class="flex flex-wrap justify-between items-center gap-2">' +
          '<div><span class="text-sm font-bold text-slate-900">' + esc(p.propertyName) + '</span> ' +
          '<span class="text-xs text-slate-500">(' + fmtMoney(p.totalLabor) + ' labor + ' + fmtMoney(p.totalMaterials) + ' materials)</span></div>' +
          '<button type="button" data-action="open-build-invoice" data-owner="' + esc(owner.ownerId) + '" data-prop="' + esc(p.propertyId) + '" data-doctype="Invoice" class="bg-white border border-blue-600 text-blue-700 hover:bg-blue-50 text-xs font-semibold px-3 py-1.5 rounded-lg">' +
          'Invoice Property (' + fmtMoney(p.totalUnbilled) + ')</button></div>' +
          '<div class="bg-white rounded-lg px-3 border border-slate-200">' + itemsHtml + '</div></div>';
      }).join('');

      return '<div class="bpm-card p-4 space-y-3">' +
        '<div class="flex flex-wrap justify-between items-center gap-2 border-b border-slate-100 pb-3">' +
        '<div><h3 class="text-base font-bold text-slate-900">' + esc(owner.ownerName) + '</h3>' +
        '<div class="text-xs text-slate-500">Default Mode: <strong>' + esc(owner.billingMode) + '</strong> &bull; Unbilled Total: <strong class="text-emerald-700">' + fmtMoney(owner.totalUnbilled) + '</strong></div></div>' +
        '<div class="flex flex-wrap gap-2">' +
        '<button type="button" data-action="open-build-invoice" data-owner="' + esc(owner.ownerId) + '" data-prop="ALL" data-doctype="Invoice" class="bg-blue-700 hover:bg-blue-800 text-white text-xs font-semibold px-3.5 py-2 rounded-lg">Consolidated Owner Invoice</button>' +
        '<button type="button" data-action="open-build-invoice" data-owner="' + esc(owner.ownerId) + '" data-prop="ALL" data-doctype="Owner Settlement" class="bg-slate-800 hover:bg-slate-900 text-white text-xs font-semibold px-3.5 py-2 rounded-lg">Monthly Owner Settlement</button>' +
        '</div></div>' +
        '<div class="space-y-3">' + propCards + '</div></div>';
    }).join('');
  }

  function openBuildInvoiceModal(ownerId, propId, docType) {
    const owner = STATE.byId.owner[ownerId] || { Owner_ID: ownerId, Owner_Name: 'Owner', Email: '', Mgmt_Fee_Pct: 8 };
    const logIds = [];
    const expIds = [];
    const propIdsMap = {};
    document.querySelectorAll('.inv-pick-log:checked').forEach(function (cb) {
      if (cb.getAttribute('data-owner') === ownerId && (propId === 'ALL' || cb.getAttribute('data-prop') === propId)) {
        logIds.push(cb.value);
        propIdsMap[cb.getAttribute('data-prop')] = true;
      }
    });
    document.querySelectorAll('.inv-pick-exp:checked').forEach(function (cb) {
      if (cb.getAttribute('data-owner') === ownerId && (propId === 'ALL' || cb.getAttribute('data-prop') === propId)) {
        expIds.push(cb.value);
        propIdsMap[cb.getAttribute('data-prop')] = true;
      }
    });
    if (propId !== 'ALL') propIdsMap[propId] = true;

    const today = todayYmd();
    const monthStart = today.slice(0, 8) + '01';
    const isSettlement = docType === 'Owner Settlement';
    const form = document.getElementById('m-build-invoice-form');
    form.innerHTML =
      '<div class="bg-blue-50 border border-blue-200 rounded-lg p-3">' +
      '<strong>' + esc(docType) + '</strong> for <strong>' + esc(owner.Owner_Name) + '</strong> &bull; Selected ' + logIds.length + ' labor + ' + expIds.length + ' material item(s)</div>' +
      '<div class="grid grid-cols-2 gap-3">' +
      '<div><label class="block font-semibold mb-1">Document Type</label><select name="docType" class="w-full rounded border border-slate-300 px-2.5 py-2 bg-white">' +
      ['Invoice', 'Owner Settlement', 'Tenant Charge'].map(function (d) { return '<option' + (d === docType ? ' selected' : '') + '>' + d + '</option>'; }).join('') + '</select></div>' +
      '<div><label class="block font-semibold mb-1">Recipient Email</label><input name="recipientEmail" value="' + esc(owner.Email || '') + '" placeholder="owner@email.com" class="w-full rounded border border-slate-300 px-2.5 py-2" /></div></div>' +
      '<div class="grid grid-cols-3 gap-2">' +
      '<div><label class="block font-semibold mb-1">Period Start</label><input type="date" name="periodStart" value="' + monthStart + '" class="w-full rounded border border-slate-300 px-2 py-2" /></div>' +
      '<div><label class="block font-semibold mb-1">Period End</label><input type="date" name="periodEnd" value="' + today + '" class="w-full rounded border border-slate-300 px-2 py-2" /></div>' +
      '<div><label class="block font-semibold mb-1">' + (isSettlement ? 'Mgmt Fee %' : 'Due Date') + '</label>' +
      (isSettlement
        ? '<input type="number" step="0.1" name="mgmtFeePct" value="' + esc(owner.Mgmt_Fee_Pct || 8) + '" class="w-full rounded border border-slate-300 px-2 py-2" />'
        : '<input type="date" name="dueDate" value="' + today + '" class="w-full rounded border border-slate-300 px-2 py-2" />') + '</div></div>' +
      '<div class="grid grid-cols-2 gap-3">' +
      '<div><label class="block font-semibold mb-1">Adjustment ($ +/-)</label><input type="number" step="0.01" name="adjustmentsAmount" value="0" class="w-full rounded border border-slate-300 px-2.5 py-2" /></div>' +
      '<div><label class="block font-semibold mb-1">Adjustment Label</label><input name="adjustmentNote" placeholder="Optional credit / fee" class="w-full rounded border border-slate-300 px-2.5 py-2" /></div></div>' +
      '<div><label class="block font-semibold mb-1">Notes to Client</label><textarea name="notesToClient" rows="2" class="w-full rounded border border-slate-300 px-2.5 py-2" placeholder="Thank you for your business!"></textarea></div>' +
      '<label class="inline-flex items-center gap-2 font-semibold"><input type="checkbox" name="saveAsDraft" /> Save as Draft first (preview before marking Sent)</label>' +
      '<div class="flex justify-end gap-2 pt-2 border-t border-slate-100">' +
      '<button type="button" data-action="close-modal" class="px-4 py-2 rounded-lg border border-slate-300 font-semibold">Cancel</button>' +
      '<button type="submit" class="px-5 py-2 rounded-lg bg-blue-700 text-white font-semibold">Generate PDF & Save</button></div>';

    form.onsubmit = async function (ev) {
      ev.preventDefault();
      const fd = new FormData(form);
      const payload = {
        docType: fd.get('docType'),
        ownerId: ownerId,
        ownerName: owner.Owner_Name,
        recipientEmail: fd.get('recipientEmail'),
        propertyIds: Object.keys(propIdsMap),
        logIds: logIds,
        expenseIds: expIds,
        periodStart: fd.get('periodStart'),
        periodEnd: fd.get('periodEnd'),
        dueDate: fd.get('dueDate') || '',
        mgmtFeePct: fd.get('mgmtFeePct'),
        adjustmentsAmount: fd.get('adjustmentsAmount'),
        adjustmentNote: fd.get('adjustmentNote'),
        notesToClient: fd.get('notesToClient'),
        saveAsDraft: form.querySelector('[name="saveAsDraft"]').checked
      };
      setLoading(true, 'Generating invoice & PDF...');
      try {
        const res = await apiCall('createInvoice', STATE.token, payload);
        closeModal();
        switchBillingSubtab('invoices');
        await loadBillingView();
        openPreviewModal({
          title: res.invoice.Invoice_Number + ' — ' + res.invoice.Doc_Type,
          html: res.html,
          pdfBase64: res.pdfBase64,
          pdfFilename: res.pdfFilename,
          invoiceId: res.invoice.Invoice_ID
        });
        showToast('Created ' + res.invoice.Invoice_Number, 'success');
      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        setLoading(false);
      }
    };
    openModal('modal-build-invoice');
  }

  function renderInvoicesList() {
    const statusFilter = document.getElementById('billing-inv-filter-status').value;
    const typeFilter = document.getElementById('billing-inv-filter-type').value;
    const q = String(document.getElementById('billing-inv-search').value || '').toLowerCase();
    const invoices = ((STATE.billingData && STATE.billingData.invoices) || []).filter(function (inv) {
      const disp = inv.Display_Status || inv.Status;
      if (statusFilter !== 'All' && disp !== statusFilter) return false;
      if (typeFilter !== 'All' && inv.Doc_Type !== typeFilter) return false;
      if (q) {
        const blob = (inv.Invoice_Number + ' ' + inv.Owner_Name + ' ' + inv.Property_Name).toLowerCase();
        if (blob.indexOf(q) === -1) return false;
      }
      return true;
    });

    const el = document.getElementById('billing-invoices-container');
    if (invoices.length === 0) {
      el.innerHTML = '<p class="text-center text-xs text-slate-400 py-8">No invoices match the selected filters.</p>';
      return;
    }

    el.innerHTML =
      '<table class="w-full text-left text-xs">' +
      '<thead><tr class="bg-slate-50 border-b border-slate-200 text-slate-500 font-semibold">' +
      '<th class="p-3">Invoice #</th><th class="p-3">Owner &amp; Property</th><th class="p-3">Dates</th>' +
      '<th class="p-3 text-right">Total / Settlement</th><th class="p-3 text-right">Balance Due</th>' +
      '<th class="p-3">Status</th><th class="p-3 text-right">Actions</th></tr></thead><tbody>' +
      invoices.map(function (inv) {
        const disp = inv.Display_Status || inv.Status;
        let lineSummary = {};
        try { lineSummary = (JSON.parse(inv.Line_Items_JSON || '{}')).summary || {}; } catch (e) {}
        const isSettle = inv.Doc_Type === 'Owner Settlement';
        return '<tr class="border-b border-slate-100 hover:bg-slate-50">' +
          '<td class="p-3"><div class="font-mono font-bold text-slate-900">' + esc(inv.Invoice_Number) + '</div>' +
          '<div class="text-[11px] text-slate-500">' + esc(inv.Doc_Type) + '</div></td>' +
          '<td class="p-3"><div class="font-semibold text-slate-900">' + esc(inv.Owner_Name) + '</div>' +
          '<div class="text-[11px] text-slate-500 truncate max-w-xs">' + esc(inv.Property_Name) + '</div></td>' +
          '<td class="p-3 whitespace-nowrap">Issued: ' + esc(inv.Issue_Date) + '<div class="text-[11px] text-slate-500">Due: ' + esc(inv.Due_Date) + '</div></td>' +
          '<td class="p-3 text-right font-semibold whitespace-nowrap">' +
          (isSettle ? ('Payout: ' + fmtMoney(lineSummary.netOwnerPayout || 0)) : fmtMoney(inv.Total_Amount)) + '</td>' +
          '<td class="p-3 text-right font-bold ' + (Number(inv.Balance_Due) > 0 ? 'text-red-700' : 'text-emerald-700') + '">' + fmtMoney(inv.Balance_Due) + '</td>' +
          '<td class="p-3"><span class="badge-pill ' + badgeClassForStatus(disp) + '">' + esc(disp) + '</span></td>' +
          '<td class="p-3 text-right whitespace-nowrap space-x-1.5">' +
          '<button type="button" data-action="preview-invoice" data-id="' + esc(inv.Invoice_ID) + '" class="px-2 py-1 rounded border border-slate-300 bg-white hover:bg-slate-50 font-semibold">PDF</button>' +
          (disp !== 'Void' ? '<button type="button" data-action="email-invoice" data-id="' + esc(inv.Invoice_ID) + '" class="px-2 py-1 rounded border border-blue-300 bg-blue-50 text-blue-800 hover:bg-blue-100 font-semibold">Email</button>' : '') +
          (Number(inv.Balance_Due) > 0 && disp !== 'Void'
            ? '<button type="button" data-action="pay-invoice" data-id="' + esc(inv.Invoice_ID) + '" class="px-2 py-1 rounded bg-emerald-600 text-white font-semibold">Pay</button>'
            : '') +
          (disp === 'Overdue'
            ? '<button type="button" data-action="remind-invoice" data-id="' + esc(inv.Invoice_ID) + '" class="px-2 py-1 rounded bg-amber-600 text-white font-semibold">Remind</button>'
            : '') +
          (disp !== 'Void'
            ? '<button type="button" data-action="void-invoice" data-id="' + esc(inv.Invoice_ID) + '" class="px-2 py-1 rounded text-red-600 hover:bg-red-50 font-semibold">Void</button>'
            : '') +
          '</td></tr>';
      }).join('') + '</tbody></table>';
  }

  function renderPaymentsLedger() {
    const pmts = (STATE.billingData && STATE.billingData.payments) || [];
    const el = document.getElementById('billing-payments-container');
    if (pmts.length === 0) {

      '<th class="p-3">Date</th><th class="p-3">Invoice #</th><th class="p-3">Method</th><th class="p-3">Reference / Batch</th><th class="p-3 text-right">Amount</th></tr></thead><tbody>' +
      pmts.map(function (p) {

  function openPreviewModal(doc) {
    STATE.previewDoc = doc;
    document.getElementById('m-preview-title').textContent = doc.title || 'Preview';
    const frame = document.getElementById('m-preview-frame');
    frame.srcdoc = doc.html || '';
    document.getElementById('m-preview-download-btn').onclick = function () {
      downloadBase64File(doc.pdfBase64, doc.pdfFilename, 'application/pdf');
    };
    const emailBtn = document.getElementById('m-preview-email-btn');
    emailBtn.classList.toggle('hidden', !doc.invoiceId);
    if (doc.invoiceId) {
      emailBtn.onclick = function () {
        closeModal();
        openEmailInvoiceModal(doc.invoiceId);
      };

  function openEmailInvoiceModal(invId) {
    const inv = STATE.byId.inv[invId];
    if (!inv) return;
    const s = (STATE.boot && STATE.boot.settings) || {};
    const form = document.getElementById('m-email-invoice-form');
    form.innerHTML =
      '<div class="bg-blue-50 p-3 rounded-lg text-blue-900">Sending <strong>' + esc(inv.Invoice_Number) + '</strong> (' + esc(inv.Doc_Type) + ' &bull; Bal ' + fmtMoney(inv.Balance_Due) + ') with PDF attached.</div>' +
      '<div><label class="block font-semibold mb-1">To Email *</label><input type="email" name="toEmail" required value="' + esc(inv.Recipient_Email || '') + '" class="w-full rounded border border-slate-300 px-2.5 py-2" /></div>' +
      '<div><label class="block font-semibold mb-1">CC Emails</label><input name="ccEmails" placeholder="Optional comma-separated emails" class="w-full rounded border border-slate-300 px-2.5 py-2" /></div>' +
      '<div><label class="block font-semibold mb-1">Subject</label><input name="subject" value="' + esc((s.COMPANY_NAME || 'BPM') + ' — ' + inv.Doc_Type + ' ' + inv.Invoice_Number) + '" class="w-full rounded border border-slate-300 px-2.5 py-2" /></div>' +
      '<div><label class="block font-semibold mb-1">Message Body</label><textarea name="messageBody" rows="4" class="w-full rounded border border-slate-300 px-2.5 py-2">' +
      esc('Hello ' + inv.Owner_Name + ',\n\nAttached is ' + inv.Doc_Type + ' #' + inv.Invoice_Number + ' for ' + inv.Property_Name + '. Payment instructions are included at the bottom of the PDF.') +
      '</textarea></div>' +
      '<div class="flex justify-end gap-2 pt-2 border-t border-slate-100">' +
      '<button type="button" data-action="close-modal" class="px-4 py-2 rounded-lg border border-slate-300 font-semibold">Cancel</button>' +
      '<button type="submit" class="px-5 py-2 rounded-lg bg-emerald-600 text-white font-semibold"><i class="fas fa-paper-plane mr-1"></i>Send Email</button></div>';

    form.onsubmit = async function (ev) {
      ev.preventDefault();
      const fd = new FormData(form);
      setLoading(true, 'Sending email with PDF...');
      try {
        await apiCall('sendInvoiceEmail', STATE.token, {
          invoiceId: invId,
          toEmail: fd.get('toEmail'),
          ccEmails: fd.get('ccEmails'),
          subject: fd.get('subject'),
          messageBody: fd.get('messageBody')
        });
        closeModal();
        await loadBillingView();
        showToast('Invoice emailed to ' + fd.get('toEmail'), 'success');
      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        setLoading(false);
      }
    };
    openModal('modal-email-invoice');
  }

  function openRecordPaymentModal(singleInvId) {
    const unpaid = ((STATE.billingData && STATE.billingData.invoices) || []).filter(function (inv) {
      return inv.Status !== 'Void' && Number(inv.Balance_Due || 0) > 0.009 && (!singleInvId || inv.Invoice_ID === singleInvId);
    });
    const isLump = !singleInvId;
    document.getElementById('m-pay-inv-heading').textContent = isLump ? 'Record Lump-Sum Multi-Invoice Payment' : 'Record Payment';
    const form = document.getElementById('m-record-payment-form');

    if (unpaid.length === 0) {
      form.innerHTML = '<p class="text-slate-500">No open unpaid invoices available.</p><div class="text-right"><button type="button" data-action="close-modal" class="px-4 py-2 rounded-lg border border-slate-300 font-semibold">Close</button></div>';
      openModal('modal-record-payment');
      return;
    }

    const totalOpen = unpaid.reduce(function (acc, i) { return acc + Number(i.Balance_Due || 0); }, 0);
    form.innerHTML =
      '<div class="grid grid-cols-3 gap-2">' +
      '<div><label class="block font-semibold mb-1">Payment Date</label><input type="date" name="paymentDate" value="' + todayYmd() + '" class="w-full rounded border border-slate-300 px-2 py-2" /></div>' +
      '<div><label class="block font-semibold mb-1">Method</label><select name="paymentMethod" class="w-full rounded border border-slate-300 px-2 py-2 bg-white">' +
      ['ACH', 'Check', 'Zelle', 'Venmo', 'Settlement Deduct', 'Cash'].map(function (m) { return '<option>' + m + '</option>'; }).join('') + '</select></div>' +
      '<div><label class="block font-semibold mb-1">Check / Ref #</label><input name="referenceNumber" placeholder="Ref #" class="w-full rounded border border-slate-300 px-2 py-2" /></div></div>' +
      (isLump
        ? '<div class="flex items-end gap-2 bg-emerald-50 p-3 rounded-lg border border-emerald-200">' +
          '<div class="flex-1"><label class="block font-semibold text-emerald-900 mb-1">Total Lump Sum Received ($) — Total Open: ' + fmtMoney(totalOpen) + '</label>' +
          '<input id="lump-total-input" type="number" step="0.01" value="' + totalOpen.toFixed(2) + '" class="w-full rounded border border-emerald-300 px-2.5 py-2 font-bold" /></div>' +
          '<button type="button" id="btn-auto-alloc-fifo" class="bg-emerald-700 text-white px-3 py-2 rounded-lg font-semibold">Auto-Distribute</button></div>'
        : '') +
      '<div class="max-h-56 overflow-y-auto border border-slate-200 rounded-lg divide-y divide-slate-100">' +
      unpaid.map(function (inv) {
        return '<div class="p-2.5 flex items-center justify-between gap-2">' +
          '<div><div class="font-bold">' + esc(inv.Invoice_Number) + ' &bull; ' + esc(inv.Owner_Name) + '</div>' +
          '<div class="text-[11px] text-slate-500">' + esc(inv.Property_Name) + ' &bull; Balance: ' + fmtMoney(inv.Balance_Due) + '</div></div>' +
          '<input type="number" step="0.01" min="0" max="' + Number(inv.Balance_Due).toFixed(2) + '" data-inv="' + esc(inv.Invoice_ID) + '" class="alloc-amt-input w-28 rounded border border-slate-300 px-2 py-1.5 text-right font-bold" value="' + Number(inv.Balance_Due).toFixed(2) + '" /></div>';
      }).join('') + '</div>' +
      '<div><label class="block font-semibold mb-1">Notes</label><input name="notes" placeholder="Optional memo" class="w-full rounded border border-slate-300 px-2.5 py-2" /></div>' +
      '<div class="flex justify-end gap-2 pt-2 border-t border-slate-100">' +
      '<button type="button" data-action="close-modal" class="px-4 py-2 rounded-lg border border-slate-300 font-semibold">Cancel</button>' +
      '<button type="submit" class="px-5 py-2 rounded-lg bg-emerald-600 text-white font-semibold">Apply Payment</button></div>';

    if (isLump) {
      document.getElementById('btn-auto-alloc-fifo').addEventListener('click', function () {
        let rem = Number(document.getElementById('lump-total-input').value || 0);
        document.querySelectorAll('.alloc-amt-input').forEach(function (inp) {
          const max = Number(inp.getAttribute('max') || 0);
          const apply = Math.min(max, Math.max(0, rem));
          inp.value = apply.toFixed(2);
          rem = Math.round((rem - apply) * 100) / 100;
        });
      });
    }

    form.onsubmit = async function (ev) {
      ev.preventDefault();
      const fd = new FormData(form);
      const allocations = [];
      document.querySelectorAll('.alloc-amt-input').forEach(function (inp) {
        const val = Number(inp.value || 0);
        if (val > 0) allocations.push({ invoiceId: inp.getAttribute('data-inv'), amount: val });
      });
      if (allocations.length === 0) {
        showToast('Enter a positive payment amount.', 'warn');
        return;
      }
      setLoading(true, 'Recording payment...');
      try {
        await apiCall('recordInvoicePayment', STATE.token, {
          allocations: allocations,
          paymentDate: fd.get('paymentDate'),
          paymentMethod: fd.get('paymentMethod'),
          referenceNumber: fd.get('referenceNumber'),
          notes: fd.get('notes')
        });
        closeModal();
        await loadBillingView();
        showToast('Payment applied successfully!', 'success');
      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        setLoading(false);
      }
    };
    openModal('modal-record-payment');
  }

  async function loadRentalsView() {
    const b = STATE.boot || {};
    const propSel = document.getElementById('rent-filter-prop');
    if (propSel && propSel.options.length === 0) {
      propSel.innerHTML = '<option value="">All Leased Properties</option>' + (b.properties || []).map(function (p) {
        return '<option value="' + esc(p.Property_ID) + '">' + esc(p.Property_Name) + '</option>';
      }).join('');
    }
    try {
      const data = await apiCall('getRentRollData', STATE.token, {
        cycleType: document.getElementById('rent-cycle-type').value,
        cycleLabel: document.getElementById('rent-cycle-label').value,
        propertyId: propSel ? propSel.value : ''
      });
      STATE.rentData = data;
      STATE.byId.lease = {};
      STATE.byId.tenant = {};
      (data.leases || []).forEach(function (l) {
        STATE.byId.lease[l.Lease_ID] = l;
        (l.tenants || []).forEach(function (t) { STATE.byId.tenant[t.Tenant_ID] = t; });
      });
      renderRentRoll(data);
    } catch (err) {
      showToast(err.message, 'error');
    }
  }

  function renderRentRoll(data) {
    const s = data.summary || {};
    const cards = [
      { label: 'This Month Scheduled', val: fmtMoney(s.monthlyScheduled), cls: 'text-slate-900' },
      { label: 'Cycle Collected', val: fmtMoney(s.cycleCollectedTotal), cls: 'text-emerald-700' },
      { label: 'Cycle Scheduled', val: fmtMoney(s.cycleScheduledTotal), cls: 'text-blue-800' },
      { label: 'Deposits Held', val: fmtMoney(s.depositsHeld), cls: 'text-indigo-700' },
      { label: 'Past Due Balance', val: fmtMoney(s.pastDueBalance), cls: 'text-red-700' }
    ];
    document.getElementById('rent-summary-strip').innerHTML = cards.map(function (c) {
      return '<div class="bpm-card p-3"><div class="text-[11px] font-semibold text-slate-500">' + esc(c.label) + '</div>' +
        '<div class="text-lg font-extrabold mt-0.5 ' + c.cls + '">' + esc(c.val) + '</div></div>';
    }).join('');

    const filterStatus = document.getElementById('rent-filter-status').value;
    const leases = (data.leases || []).filter(function (l) {
      if (filterStatus === 'PastDue' && Number(l.leasePastDue || 0) <= 0) return false;
      return true;
    });

    const container = document.getElementById('rent-matrix-container');
    if (leases.length === 0) {
      container.innerHTML = '<div class="bpm-card p-8 text-center text-xs text-slate-400">No leases found for ' + esc(data.cycleType + ' ' + data.cycleLabel) + '. Click "+ New Lease" to add one.</div>';
    } else {
      const months = data.months || [];
      container.innerHTML = leases.map(function (lease) {
        const headerCols = months.map(function (m) {
          const isCur = m.key === data.currentMonth;
          return '<th class="p-2 text-center border-l border-slate-200 ' + (isCur ? 'bg-blue-50 text-blue-900' : 'bg-slate-50 text-slate-600') + '">' + esc(m.label) + '</th>';
        }).join('');

        const tenantRows = (lease.tenants || []).map(function (t) {
          const cells = months.map(function (m) {
            const c = t.months[m.key] || { status: 'Outside', scheduled: 0, balance: 0, applied: 0 };
            let bg = 'bg-white text-slate-400';
            let topTxt = '—';
            let subTxt = '';
            if (c.status === 'Outside') {
              bg = 'bg-slate-100 text-slate-400';
              topTxt = 'N/A';
            } else if (c.status === 'Waived') {
              bg = 'bg-slate-100 text-slate-500';
              topTxt = '$0 Waived';
            } else if (c.status === 'Prepaid') {
              bg = 'bg-teal-50 text-teal-800';
              topTxt = c.prepaidCashAnchor > 0 ? fmtMoney(c.prepaidCashAnchor) : 'Prepaid';
              subTxt = c.prepaidCashAnchor > 0 ? 'Lump Sum' : 'Covered';
            } else if (c.status === 'Paid') {
              bg = 'bg-emerald-50 text-emerald-800';
              topTxt = fmtMoney(c.applied);
              subTxt = c.paidDate ? c.paidDate.slice(5) : 'Paid';
            } else if (c.status === 'Past Due' || c.status === 'Partial Past Due') {
              bg = 'bg-red-50 text-red-800 font-bold';
              topTxt = fmtMoney(c.balance) + ' due';
              subTxt = c.applied > 0 ? ('Pd ' + fmtMoney(c.applied)) : 'Past Due';
            } else if (c.status === 'Partial') {
              bg = 'bg-amber-50 text-amber-800';
              topTxt = fmtMoney(c.balance) + ' left';
              subTxt = 'Pd ' + fmtMoney(c.applied);
            } else {
              bg = 'bg-white text-slate-700';
              topTxt = fmtMoney(c.scheduled);
              subTxt = c.status;
            }
            return '<td data-action="rent-cell" data-tenant="' + esc(t.Tenant_ID) + '" data-month="' + esc(m.key) + '" class="rent-cell border-l border-slate-200 p-1.5 text-center align-middle ' + bg + '">' +
              '<div class="text-[11px] font-semibold">' + esc(topTxt) + '</div>' +
              (subTxt ? '<div class="text-[10px] opacity-75">' + esc(subTxt) + '</div>' : '') + '</td>';
          }).join('');

          return '<tr class="border-t border-slate-200 hover:bg-slate-50/40">' +
            '<td class="sticky-col-left p-2.5 min-w-[210px] border-r border-slate-200">' +
            '<div class="flex items-center justify-between gap-1">' +
            '<button type="button" data-action="edit-tenant" data-id="' + esc(t.Tenant_ID) + '" class="font-bold text-slate-900 hover:text-blue-700 text-left">' + esc(t.Name) + '</button>' +
            '<button type="button" data-action="open-deposit-settlement" data-id="' + esc(t.Tenant_ID) + '" title="Deposit Settlement PDF" class="text-[10px] text-slate-500 hover:text-blue-700 px-1.5 py-0.5 border border-slate-200 rounded">Dep</button></div>' +
            '<div class="text-[11px] text-slate-500">Rent: ' + fmtMoney(t.Rent_Share) + '/mo &bull; Dep Held: ' + fmtMoney(t.Deposit_Paid) + '</div></td>' +
            cells + '</tr>';
        }).join('');

        return '<div class="bpm-card overflow-hidden">' +
          '<div class="bg-slate-50 px-4 py-3 border-b border-slate-200 flex flex-wrap items-center justify-between gap-2">' +
          '<div><div class="flex items-center gap-2"><h3 class="text-sm font-extrabold text-slate-900">' + esc(lease.Property_Name) + '</h3>' +
          '<span class="badge-pill bg-blue-100 text-blue-800">' + esc(lease.Cycle_Label) + '</span>' +
          (Number(lease.leasePastDue) > 0 ? '<span class="badge-pill bg-red-100 text-red-800">Past Due: ' + fmtMoney(lease.leasePastDue) + '</span>' : '') + '</div>' +
          '<div class="text-[11px] text-slate-500">' + esc(lease.Start_Date) + ' to ' + esc(lease.End_Date) + ' &bull; House Rent: <strong>' + fmtMoney(lease.Monthly_Rent_Total) + '/mo</strong> &bull; Collected: <strong class="text-emerald-700">' + fmtMoney(lease.leasePaidTotal) + '</strong></div></div>' +
          '<div class="flex flex-wrap gap-1.5">' +
          '<button type="button" data-action="add-tenant" data-lease="' + esc(lease.Lease_ID) + '" class="px-2.5 py-1.5 rounded-lg border border-slate-300 bg-white text-[11px] font-semibold hover:bg-slate-100">+ Tenant</button>' +
          '<button type="button" data-action="edit-lease" data-id="' + esc(lease.Lease_ID) + '" class="px-2.5 py-1.5 rounded-lg border border-slate-300 bg-white text-[11px] font-semibold hover:bg-slate-100">Edit Lease</button>' +
          '<button type="button" data-action="renew-lease" data-id="' + esc(lease.Lease_ID) + '" class="px-2.5 py-1.5 rounded-lg bg-slate-800 text-white text-[11px] font-semibold hover:bg-slate-900">Renew</button>' +
          '</div></div>' +
          '<div class="overflow-x-auto"><table class="w-full text-xs border-collapse">' +
          '<thead><tr><th class="sticky-header-left p-2.5 text-left text-slate-600 border-r border-slate-200">Tenant</th>' + headerCols + '</tr></thead>' +
          '<tbody>' + (tenantRows || '<tr><td colspan="14" class="p-4 text-center text-slate-400">No tenants on this lease yet.</td></tr>') + '</tbody></table></div></div>';
      }).join('');
    }

    const ledgerEl = document.getElementById('rent-recent-ledger');
    const recent = data.recentLedger || [];
    ledgerEl.innerHTML = recent.length === 0
      ? '<p class="text-slate-400 py-2">No rent ledger entries recorded.</p>'
      : '<table class="w-full text-left"><thead><tr class="text-slate-500 border-b border-slate-200">' +
        '<th class="p-2">Date</th><th class="p-2">Property</th><th class="p-2">Tenant</th><th class="p-2">Type</th><th class="p-2">Period</th><th class="p-2 text-right">Amount</th></tr></thead><tbody>' +
        recent.map(function (r) {
          return '<tr class="border-b border-slate-100"><td class="p-2">' + esc(r.Entry_Date) + '</td><td class="p-2 font-semibold">' + esc(r.Property_Name) + '</td><td class="p-2">' + esc(r.Tenant_Name) + '</td>' +
            '<td class="p-2">' + esc(r.Entry_Type) + '</td><td class="p-2">' + esc(r.Period_Month) + (Number(r.Months_Covered) > 1 ? ' (' + r.Months_Covered + 'm)' : '') + '</td>' +
            '<td class="p-2 text-right font-bold text-emerald-700">' + fmtMoney(r.Amount) + '</td></tr>';
        }).join('') + '</tbody></table>';
  }

        startDate: document.getElementById('payroll-start-date').value,

  function parseBulkText() {
    const raw = String(document.getElementById('bulk-raw-input').value || '').trim();
    const prev = document.getElementById('bulk-preview-container');
    if (!raw) {
      STATE.bulkParsedRows = [];
      prev.innerHTML = '';
      return;
    }
    const lines = raw.split(/\r?\n/).filter(Boolean);
    if (lines.length < 2) {
      prev.innerHTML = '<p class="text-amber-700">Include a header row plus at least one data row.</p>';
      return;
    }
    const delim = lines[0].indexOf('\t') !== -1 ? '\t' : ',';
    const headers = lines[0].split(delim).map(function (h) { return h.trim(); });
    const rows = [];
    for (let i = 1; i < lines.length; i++) {
      const vals = lines[i].split(delim);
      const obj = {};
      headers.forEach(function (h, idx) { obj[h] = (vals[idx] || '').trim(); });
      rows.push(obj);
    }
    STATE.bulkParsedRows = rows;
    prev.innerHTML = '<div class="text-emerald-700 font-semibold mb-1">Parsed ' + rows.length + ' row(s)</div>' +
      '<table class="w-full text-left border"><thead><tr class="bg-slate-50">' + headers.map(function (h) { return '<th class="p-1.5 border">' + esc(h) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      rows.slice(0, 5).map(function (r) {
        return '<tr>' + headers.map(function (h) { return '<td class="p-1.5 border">' + esc(r[h]) + '</td>'; }).join('') + '</tr>';
      }).join('') + '</tbody></table>';
  }

        const ts = MOCK_DB.tenants.filter(function (tn) { return tn.Lease_ID === l.Lease_ID; }).map(function (tn) {
          let ov = {};
          try { ov = JSON.parse(tn.Lease_Override_Months_JSON || '{}'); } catch (e) {}
          const mMap = {};
          months.forEach(function (m) {
            const led = MOCK_DB.rentLedger.filter(function (r) { return r.Tenant_ID === tn.Tenant_ID; });
            let prepaid = false;
            led.forEach(function (r) {
              if (r.Entry_Type === 'Upfront Prepay' && r.Covered_Months_JSON && r.Covered_Months_JSON.indexOf(m.key) !== -1) prepaid = true;
            });
            if (ov[m.key] === 0) mMap[m.key] = { status: 'Waived', scheduled: 0, applied: 0, balance: 0 };
            else if (prepaid) mMap[m.key] = { status: 'Prepaid', scheduled: tn.Rent_Share, applied: tn.Rent_Share, balance: 0, prepaidCashAnchor: m.key === '2026-05' ? 4440 : 0 };
            else if (m.key <= '2026-11') mMap[m.key] = { status: 'Paid', scheduled: tn.Rent_Share, applied: tn.Rent_Share, balance: 0, paidDate: '2026-11-01' };
            else mMap[m.key] = { status: 'Upcoming', scheduled: tn.Rent_Share, applied: 0, balance: tn.Rent_Share };
          });
          return Object.assign({}, tn, { months: mMap, hasPastDue: false });
        });
        return Object.assign({}, l, { tenants: ts, leasePaidTotal: 6820, leasePastDue: 0 });
      });
      return { cycleType: isCal ? 'Calendar' : 'Academic', cycleLabel: p.cycleLabel || '26-27', currentMonth: '2026-11', months: months, summary: { monthlyScheduled: 1880, cycleCollectedTotal: 10550, cycleScheduledTotal: 22560, depositsHeld: 1050, pastDueBalance: 0, pastDueTenants: 0 }, leases: leases, recentLedger: MOCK_DB.rentLedger };
    },
    recordRentLedgerEntry: function (t, p) { MOCK_DB.rentLedger.unshift(Object.assign({ Ledger_ID: 'LDG-' + Date.now(), Tenant_Name: 'Tenant', Property_Name: 'Property' }, p)); return { ok: true }; },
    setTenantMonthOverride: function (t, p) {
      const tn = MOCK_DB.tenants.find(function (r) { return r.Tenant_ID === p.tenantId; });
      if (tn) {
        const ov = JSON.parse(tn.Lease_Override_Months_JSON || '{}');
        if (p.clearOverride) delete ov[p.monthKey]; else ov[p.monthKey] = Number(p.overrideAmount);
        tn.Lease_Override_Months_JSON = JSON.stringify(ov);
      }
      return tn;
    },
    saveLease: function (t, p) { MOCK_DB.leases.push(Object.assign({ Lease_ID: 'LSE-' + Date.now(), Property_Name: 'New Property' }, p)); return { ok: true }; },
    saveTenant: function (t, p) { MOCK_DB.tenants.push(Object.assign({ Tenant_ID: 'TNT-' + Date.now() }, p)); return { ok: true }; },
    generateDepositSettlement: function (t, p) {
      return { ok: true, html: '<html><body style="padding:24px;font-family:Arial"><h2>Deposit Settlement Statement</h2><p>Deposit Held: $' + p.depositPaidOverride + '</p></body></html>', pdfBase64: '', pdfFilename: 'Deposit_Settlement.pdf' };
    },
    getPayrollSummary: function () {
      return {
        workers: MOCK_DB.employees.map(function (e) {
          const al = MOCK_DB.workLogs.filter(function (l) { return l.Employee_ID === e.Employee_ID && l.Payroll_Status === 'Approved'; });
          const pl = MOCK_DB.workLogs.filter(function (l) { return l.Employee_ID === e.Employee_ID && l.Payroll_Status === 'Pending'; });
          const ar = MOCK_DB.expenses.filter(function (x) { return x.Employee_ID === e.Employee_ID && x.Paid_By === 'Employee Out-of-Pocket' && x.Payroll_Status === 'Approved'; });
          const reg = al.reduce(function (a, b) { return a + b.Gross_Pay; }, 0);
          const rei = ar.reduce(function (a, b) { return a + b.Total_Cost; }, 0);
          return { employeeId: e.Employee_ID, name: e.Name, email: e.Email, role: e.Role, payType: e.Pay_Type, defaultPayRate: e.Default_Pay_Rate, approvedHours: al.reduce(function (a, b) { return a + b.Hours; }, 0), approvedRegularPay: reg, approvedReimbursementsPay: rei, totalApprovedPayout: reg + rei, pendingCount: pl.length, pendingAmount: pl.reduce(function (a, b) { return a + b.Gross_Pay; }, 0), approvedLogs: al, approvedReimbursements: ar, pendingLogs: pl };
        }),
        history: MOCK_DB.payrollHistory
      };
    },
    runPayrollBatch: function (t, p) {
      const pid = 'PAY-' + (Date.now() % 10000);
      let hrs = 0; let reg = 0; let rei = 0;
      MOCK_DB.workLogs.forEach(function (l) { if (p.logIds.indexOf(l.Log_ID) !== -1 && l.Payroll_Status === 'Approved') { l.Payroll_Status = 'Paid'; l.Payroll_ID = pid; hrs += l.Hours; reg += l.Gross_Pay; } });
      MOCK_DB.expenses.forEach(function (e) { if (p.expenseIds.indexOf(e.Expense_ID) !== -1 && e.Payroll_Status === 'Approved') { e.Payroll_Status = 'Paid'; e.Payroll_ID = pid; rei += e.Total_Cost; } });
      const rec = { Payroll_ID: pid, Run_Date: todayYmd(), Employee_Name: 'Worker', Total_Hours: hrs, Regular_Pay: reg, Reimbursements_Pay: rei, Adjustment_Amount: Number(p.adjustmentAmount || 0), Net_Payout: reg + rei + Number(p.adjustmentAmount || 0), Payment_Method: p.paymentMethod };
      MOCK_DB.payrollHistory.unshift(rec);
      return { ok: true, payroll: rec, html: '<html><body style="padding:24px;font-family:Arial"><h2>Paystub ' + pid + '</h2><p>Net Payout: $' + rec.Net_Payout.toFixed(2) + '</p></body></html>', pdfBase64: '', pdfFilename: pid + '.pdf' };
    },
    saveSettings: function (t, patch) { Object.assign(MOCK_DB.settings, patch); return MOCK_DB.settings; },
    saveOwner: function (t, p) { MOCK_DB.owners.push(Object.assign({ Owner_ID: p.ownerId || ('OWN-' + Date.now()) }, { Owner_Name: p.ownerName, Email: p.email, Billing_Mode: p.billingMode, Mgmt_Fee_Pct: p.mgmtFeePct })); return { ok: true }; },
    saveProperty: function (t, p) { MOCK_DB.properties.push({ Property_ID: 'PROP-' + Date.now(), Property_Name: p.propertyName, Owner_ID: p.ownerId, Address: p.address, Unit_Type: p.unitType, Default_Lease_Cycle: p.defaultLeaseCycle }); return { ok: true }; },
    saveTask: function (t, p) { MOCK_DB.tasks.push({ Task_ID: 'TSK-' + Date.now(), Task_Name: p.taskName, Default_Billable_Rate: Number(p.defaultBillableRate), Default_Billing_Unit: p.defaultBillingUnit }); return { ok: true }; },
    saveEmployee: function (t, p) { MOCK_DB.employees.push({ Employee_ID: 'EMP-' + Date.now(), Name: p.name, Email: p.email, Role: p.role, Pay_Type: p.payType, Default_Pay_Rate: Number(p.defaultPayRate), Has_Pin: Boolean(p.newPin) }); return { ok: true }; },
    saveBillingRate: function (t, p) { MOCK_DB.billingRates.push({ Rate_ID: 'RT-' + Date.now(), Scope_Type: p.scopeType, Scope_ID: p.scopeId, Scope_Name: p.scopeName, Task_Name: p.taskName, Billable_Rate: Number(p.billableRate) }); return { ok: true }; },
    deleteBillingRate: function () { return { ok: true }; },
    importBulkRecords: function (t, p) { return { ok: true, imported: (p.rows || []).length }; },
    installAutomationTriggers: function () { return { ok: true, triggersInstalled: 2 }; },
    sendTestWeeklyDigest: function () { return { ok: true, sentTo: MOCK_DB.settings.DISPATCH_EMAIL }; }
  };

  document.addEventListener('DOMContentLoaded', function () {
    bindGlobalListeners();
    initApp();
  });
})();
</script>
