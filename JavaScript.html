        document.addEventListener('DOMContentLoaded', initializeApp);
    } else {

    function populateDatalists(data) {
        validProperties = data.properties || [];
        validTasks = data.tasks || [];
        const validEmployees = data.employees || [];

        const propList = document.getElementById('property-list');
        if (propList) {
            propList.innerHTML = '';
            validProperties.forEach(prop => propList.insertAdjacentHTML('beforeend', `<option value="${prop}">`));
        }

        // Populate Tasks dropdowns
        const taskDropdowns = [
            document.getElementById('log-task'),
            document.getElementById('edit-log-task'),
            document.getElementById('rate-task-id')
        ];

        taskDropdowns.forEach(dropdown => {
            if (!dropdown) return;
            dropdown.innerHTML = '<option value="">-- Select Task --</option>';
            validTasks.forEach(task => dropdown.insertAdjacentHTML('beforeend', `<option value="${task}">${task}</option>`));

            if (dropdown.id === 'log-task' || dropdown.id === 'edit-log-task') {
                dropdown.insertAdjacentHTML('beforeend', `<option value="ADD_NEW_TASK">Add New Task...</option>`);

                // Clone and replace to prevent duplicate listeners
                const newDropdown = dropdown.cloneNode(true);
                dropdown.parentNode.replaceChild(newDropdown, dropdown);

                newDropdown.addEventListener('change', function(e) {
                    if (e.target.value === 'ADD_NEW_TASK') {
                        e.target.value = "";
                        openTaskModal();
                    }
                });
            }
        });

        // Populate Employee dropdown
        const empDropdown = document.getElementById('rate-employee-id');
        if (empDropdown) {
            empDropdown.innerHTML = '<option value="">-- Select Employee --</option><option value="DEFAULT">Default (All Employees)</option>';
            validEmployees.forEach(emp => {
                empDropdown.insertAdjacentHTML('beforeend', `<option value="${emp.id}">${emp.name} (${emp.id})</option>`);
            });
        }
    }

    function applyUserPermissions(role) {
        currentRole = role;
        const dashTab = document.getElementById('tab-dashboard-view');
        if (role === 'admin' || role === 'owner') {
            document.getElementById('tab-payroll-view').classList.remove('hidden');
            document.getElementById('tab-billing-view').classList.remove('hidden');
            document.getElementById('tab-lease-view').classList.remove('hidden');
            document.getElementById('tab-settings-view').classList.remove('hidden');
            document.getElementById('charge-target-container').classList.remove('hidden');
            if (role === 'owner') dashTab.classList.remove('hidden');
            else dashTab.classList.add('hidden');
            
            loadLeasesAndTenants();
        } else {
            document.getElementById('tab-payroll-view').classList.add('hidden');
            document.getElementById('tab-billing-view').classList.add('hidden');
            dashTab.classList.add('hidden');
            document.getElementById('tab-lease-view').classList.add('hidden');
            document.getElementById('tab-settings-view').classList.add('hidden');
            document.getElementById('charge-target-container').classList.add('hidden');
        }
    }

    function switchTab(tabId) {
        const views = ['employee-view', 'history-view', 'dashboard-view', 'payroll-view', 'billing-view', 'lease-view', 'settings-view'];
        views.forEach(t => {
            document.getElementById(t).classList.add('hidden');
            const el = document.getElementById(`tab-${t}`);
            if(el) {
                el.classList.remove('border-blue-600', 'text-blue-600');
                el.classList.add('border-transparent', 'text-gray-500');
            }
        });

        document.getElementById(tabId).classList.remove('hidden');
        const activeTabEl = document.getElementById(`tab-${tabId}`);
        if(activeTabEl) {
            activeTabEl.classList.remove('border-transparent', 'text-gray-500');
            activeTabEl.classList.add('border-blue-600', 'text-blue-600');
        }

        if (tabId === 'settings-view') {
            if (document.getElementById('billing-rates-sub').classList.contains('hidden') &&
                document.getElementById('properties-sub').classList.contains('hidden') &&
                document.getElementById('employees-sub').classList.contains('hidden') &&
                document.getElementById('tasks-sub').classList.contains('hidden')) {
                switchSettingsSubTab('billing-rates-sub');
            }
        } else if (tabId === 'lease-view') {
            if (document.getElementById('rent-tracking-sub').classList.contains('hidden') &&
                document.getElementById('lease-management-sub').classList.contains('hidden') &&
                document.getElementById('settlements-sub').classList.contains('hidden')) {
                switchRentalSubTab('rent-tracking-sub');
            }
        } else if (tabId === 'dashboard-view') {
            loadDashboardData();
        } else if(tabId === 'history-view') {
            loadEmployeeHistory();
        } else if(tabId === 'payroll-view' || tabId === 'billing-view') {
            loadAdminDashboardData();
        }
    }

    function switchRentalSubTab(subTabId) {
        ['lease-management-sub', 'settlements-sub', 'rent-tracking-sub'].forEach(id => {
            document.getElementById(id).classList.add('hidden');
            const el = document.getElementById(`tab-${id}`);
            if (el) el.className = "flex-1 py-2 px-4 rounded-lg text-gray-600 hover:bg-gray-50 font-medium text-sm transition-colors text-center";
        });

        document.getElementById(subTabId).classList.remove('hidden');
        const activeTabEl = document.getElementById(`tab-${subTabId}`);
        if (activeTabEl) activeTabEl.className = "flex-1 py-2 px-4 rounded-lg bg-blue-50 text-blue-700 font-medium text-sm transition-colors text-center";
    }

    function switchSettingsSubTab(subTabId) {
        ['billing-rates-sub', 'properties-sub', 'employees-sub', 'tasks-sub'].forEach(id => {
            document.getElementById(id).classList.add('hidden');
            const el = document.getElementById(`tab-${id}`);
            if (el) {
                el.classList.remove('bg-blue-50', 'text-blue-700');
                el.classList.add('text-gray-600', 'hover:bg-gray-50');
            }
        });

        document.getElementById(subTabId).classList.remove('hidden');
        const tabBtn = document.getElementById(`tab-${subTabId}`);
        if (tabBtn) {
            tabBtn.classList.remove('text-gray-600', 'hover:bg-gray-50');
            tabBtn.classList.add('bg-blue-50', 'text-blue-700');
        }

        if (subTabId === 'billing-rates-sub') loadRates();
        else if (subTabId === 'properties-sub') loadProperties();
        else if (subTabId === 'employees-sub') loadEmployees();
        else if (subTabId === 'tasks-sub') loadTasks();
    }

    function addMaterialRow() {

        const noMsg = document.getElementById('no-materials-msg');
        if (noMsg) noMsg.style.display = 'none';

        materialCount++;
        const rowId = `material-row-${materialCount}`;

        const rowHTML = `
            <div id="${rowId}" class="flex flex-col sm:flex-row gap-2 items-start bg-gray-50 p-2.5 rounded-lg border border-gray-200">
                <div class="flex-1 space-y-2 w-full">
                    <select class="w-full rounded border-gray-300 border p-2 text-sm focus:ring-blue-500 outline-none material-vendor bg-white" required>
                        <option value="" disabled selected>Vendor...</option>
                        <option value="Home Depot">Home Depot</option>
                        <option value="Lowes">Lowe's</option>
                        <option value="Other">Other</option>
                    </select>
                    <input type="text" placeholder="Item description" required class="w-full rounded border-gray-300 border p-2 text-sm focus:ring-blue-500 outline-none material-desc" />
                </div>
                <div class="w-full sm:w-32 space-y-2">
                    <input type="number" step="0.01" min="0.01" placeholder="$ Cost" required class="w-full rounded border-gray-300 border p-2 text-sm focus:ring-blue-500 outline-none material-cost" />
                    <div>
                        <label class="block text-[10px] text-gray-500 font-medium">Receipt Photo / PDF</label>
                        <input type="file" accept="image/*,application/pdf" class="w-full text-xs text-gray-500 material-file border rounded bg-white p-1" />
                    </div>
                </div>
                <div class="self-end sm:self-center">
                    <button type="button" onclick="removeMaterialRow('${rowId}')" class="text-red-500 hover:text-red-700 hover:bg-red-50 text-xs p-2 rounded transition-colors">
                        <i class="fas fa-trash"></i>

    function removeMaterialRow(rowId) {
        document.getElementById(rowId).remove();
        const container = document.getElementById('materials-container');
        if (container.children.length === 1 && container.children[0].id === 'no-materials-msg') {
            document.getElementById('no-materials-msg').style.display = 'block';
        }
    }

    function submitWorkLog(e) {
        if(e) e.preventDefault();
        const selectedProperty = document.getElementById('log-property').value.trim();
        if (!validProperties.includes(selectedProperty) && !bypassPropertyWarning) {
            showWarningModal(selectedProperty);
            return;
        }
        executeSubmission();
    }

    function showWarningModal(propertyName) {
        const modal = document.getElementById('confirmation-modal');
        document.getElementById('unlisted-prop-name').innerText = `"${propertyName}"`;
        modal.classList.remove('hidden');
        setTimeout(() => {
            modal.classList.remove('opacity-0');
            document.getElementById('modal-content').classList.remove('scale-95');
        }, 10);
    }

    function closeWarningModal(proceed) {
        const modal = document.getElementById('confirmation-modal');
        modal.classList.add('opacity-0');
        document.getElementById('modal-content').classList.add('scale-95');
        setTimeout(() => {
            modal.classList.add('hidden');
            if (proceed) { bypassPropertyWarning = true; executeSubmission(); } 
            else document.getElementById('log-property').focus();
        }, 300);
    }

    async function executeSubmission() {
        const btn = document.getElementById('submit-btn');
        const originalBtnHTML = btn.innerHTML;
        btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> <span>Saving & Uploading...</span>`;
        btn.disabled = true;

        const payload = {
            date: document.getElementById('log-date').value,
            propertyId: document.getElementById('log-property').value.trim(),
            taskId: document.getElementById('log-task').value.trim(),
            hours: parseFloat(document.getElementById('log-hours').value),
            notes: document.getElementById('log-notes').value,
            chargeTarget: currentRole === 'admin' ? document.getElementById('log-charge-target').value : 'Owner',
            materials: []
        };

        const materialRows = document.querySelectorAll('[id^="material-row-"]');
        for (var i = 0; i < materialRows.length; i++) {
            const row = materialRows[i];
            const fileInput = row.querySelector('.material-file');
            let fileData = null, fileName = null, fileType = null;

            if (fileInput && fileInput.files && fileInput.files[0]) {
                const file = fileInput.files[0];
                fileName = file.name; fileType = file.type;
                fileData = await readFileAsBase64(file);
            }

            payload.materials.push({
                vendor: row.querySelector('.material-vendor').value,
                description: row.querySelector('.material-desc').value,
                cost: parseFloat(row.querySelector('.material-cost').value),
                fileData: fileData, fileName: fileName, fileType: fileType
            });
        }

        google.script.run
            .withSuccessHandler(function(response) {
                btn.innerHTML = originalBtnHTML;
                btn.disabled = false;
                if (response.success) {
                    document.getElementById('work-log-form').reset();
                    document.getElementById('log-date').valueAsDate = new Date();
                    bypassPropertyWarning = false;
                    document.getElementById('materials-container').innerHTML = `<p id="no-materials-msg" class="text-sm text-gray-400 italic text-center py-2 bg-gray-50 rounded-lg border border-dashed border-gray-300">No materials added. Click 'Add Item' if you purchased supplies.</p>`;
                    materialCount = 0;
                    showToast('Success!', 'Work log & receipt uploaded successfully.', 'success');

            reader.readAsDataURL(file);
        });

    // --- PAY PERIOD FILTER HELPERS ---
    function setPayPeriodFilter(type) {
        const pStartInput = document.getElementById('payroll-start-date');
        const pEndInput = document.getElementById('payroll-end-date');
        const bStartInput = document.getElementById('billing-start-date');
        const bEndInput = document.getElementById('billing-end-date');
        const now = new Date();

        if (type === 'all') {
            pStartInput.value = ''; pEndInput.value = '';
            bStartInput.value = ''; bEndInput.value = '';
        } else if (type === 'current') {
            const dayOfWeek = now.getDay();
            const start = new Date(now); start.setDate(now.getDate() - dayOfWeek - 7);
            pStartInput.valueAsDate = start; pEndInput.valueAsDate = now;
            bStartInput.valueAsDate = start; bEndInput.valueAsDate = now;
        } else if (type === 'previous') {
            const start = new Date(now); start.setDate(now.getDate() - 28);
            const end = new Date(now); end.setDate(now.getDate() - 14);
            pStartInput.valueAsDate = start; pEndInput.valueAsDate = end;
            bStartInput.valueAsDate = start; bEndInput.valueAsDate = end;
        }
        loadAdminDashboardData();
    }

    function sortAdminWorkLogs(col) {
        if (currentSortCol === col) {
            sortAscending = !sortAscending;
        } else {
            currentSortCol = col;
            sortAscending = true;
        }

        currentAdminWorkLogs.sort((a, b) => {
            let valA = a[col];
            let valB = b[col];

            if (typeof valA === 'string') valA = valA.toLowerCase();
            if (typeof valB === 'string') valB = valB.toLowerCase();

            if (valA < valB) return sortAscending ? -1 : 1;
            if (valA > valB) return sortAscending ? 1 : -1;
            return 0;
        });

        renderWorkLogsTable();
    }

    function updateDashboardUI(data) {
        document.getElementById('dash-kpi-rent-billed').textContent = `$${data.rent.billed.toFixed(2)}`;
        document.getElementById('dash-kpi-rent-collected').textContent = `$${data.rent.collected.toFixed(2)}`;

        document.getElementById('dash-kpi-net-profit').textContent = `$${data.financials.netProfit.toFixed(2)}`;

        updateChart(data.financials.cashIn, data.financials.cashOut);

        const tbody = document.getElementById('dash-ar-tbody');
        tbody.innerHTML = '';
        if (data.accountsReceivable.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="px-4 py-4 text-center">No outstanding balances found.</td></tr>';
            return;
        }

        data.accountsReceivable.forEach(item => {
            const tr = document.createElement('tr');
            tr.className = "border-b hover:bg-gray-50";
            const typeClass = item.type === 'Rent' ? 'bg-blue-100 text-blue-800' : 'bg-orange-100 text-orange-800';
            let actionBtn = item.type === 'Maintenance' ? `<button onclick="markPropPaid('${item.propertyId}')" class="text-blue-600 hover:text-blue-800 font-medium text-xs border border-blue-600 rounded px-2 py-1">Mark Paid</button>` : '';

            tr.innerHTML = `
                <td class="px-4 py-3"><span class="px-2 py-1 rounded-full text-xs font-medium ${typeClass}">${item.type}</span></td>
                <td class="px-4 py-3 font-medium">${item.propertyId}</td>
                <td class="px-4 py-3 text-right font-semibold">$${item.amount.toFixed(2)}</td>
                <td class="px-4 py-3 text-right ${item.daysOverdue > 30 ? 'text-red-600 font-bold' : ''}">${item.daysOverdue} days</td>
                <td class="px-4 py-3 text-center">${actionBtn}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    function updateChart(cashIn, cashOut) {

        cashFlowChart = new Chart(ctx, {

                labels: ['Cash Flow'],
                datasets: [
                    { label: 'Cash In', data: [cashIn], backgroundColor: 'rgba(34, 197, 94, 0.8)', borderColor: 'rgb(21, 128, 61)', borderWidth: 1 },
                    { label: 'Cash Out', data: [cashOut], backgroundColor: 'rgba(239, 68, 68, 0.8)', borderColor: 'rgb(185, 28, 28)', borderWidth: 1 }
                ]
            },
            options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, ticks: { callback: function(value) { return '$' + value; } } } } }
        });
    }

    let currentSDSettlementData = null; // Store fetched SD data to dynamically recalculate

    function updateSDFinancials() {
        if (!currentSDSettlementData) return;
        const st = currentSDSettlementData;
        let waived = parseFloat(document.getElementById('sd-out-late-waived').value) || 0;
        if (waived > st.lateFeesIncurred) {
            waived = st.lateFeesIncurred;
            document.getElementById('sd-out-late-waived').value = waived.toFixed(2);
        }
        const netLateFee = st.lateFeesIncurred - waived;
        const netRefund = st.securityDeposit - st.unpaidRent - netLateFee - st.totalDamages;

        document.getElementById('sd-out-late-net').innerText = `-$${netLateFee.toFixed(2)}`;
        document.getElementById('sd-out-refund').innerText = `$${netRefund.toFixed(2)}`;
    }

    function generateSDSettlementUI(e) {
        e.preventDefault();
        const btn = document.getElementById('btn-gen-sd');
        const originalText = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Generating...';
        btn.disabled = true;
        const leaseId = document.getElementById('sd-lease-select').value;

        google.script.run
            .withSuccessHandler(function(res) {
                btn.innerHTML = originalText;
                btn.disabled = false;
                if (res.success) {
                    currentSDSettlementData = res.settlement;
                    const st = res.settlement;

                    document.getElementById('sd-out-dep').innerText = `$${st.securityDeposit.toFixed(2)}`;
                    document.getElementById('sd-out-rent').innerText = `-$${st.unpaidRent.toFixed(2)}`;

    let rtSortCol = -1;
    let rtSortAsc = true;
    function sortRentTracking(colIndex) {
        if (rtSortCol === colIndex) { rtSortAsc = !rtSortAsc; } 
        else { rtSortCol = colIndex; rtSortAsc = true; }
        renderRentTrackingTable();
    }

    function renderRentTrackingTable() {
        const tbody = document.getElementById('rent-tracking-tbody');
        const ownerFilter = document.getElementById('rt-owner-filter').value.toLowerCase();
        const addressFilter = document.getElementById('rt-address-filter').value.toLowerCase();

        let filteredData = currentRentRollData.filter(r => {
            const matchOwner = !ownerFilter || (r.owner && r.owner.toLowerCase().includes(ownerFilter));
            const matchAddress = !addressFilter || (r.address && r.address.toLowerCase().includes(addressFilter));
            return matchOwner && matchAddress;
        });

        if (rtSortCol !== -1) {
            filteredData.sort((a, b) => {
                let valA, valB;
                if (rtSortCol === 0) { valA = a.property; valB = b.property; }
                else if (rtSortCol === 1) { valA = a.owner; valB = b.owner; }
                else if (rtSortCol === 2) { valA = a.address; valB = b.address; }
                else if (rtSortCol === 3) { valA = a.tenantName; valB = b.tenantName; }
                if (valA < valB) return rtSortAsc ? -1 : 1;
                if (valA > valB) return rtSortAsc ? 1 : -1;
                return 0;
            });
        }

        tbody.innerHTML = '';
        if (filteredData.length === 0) {
            tbody.innerHTML = '<tr><td colspan="17" class="text-center py-4 text-gray-500">No rent data found for criteria.</td></tr>';
            return;
        }

        filteredData.forEach(row => {
            let tr = document.createElement('tr');
            tr.className = "hover:bg-gray-50 transition-colors";

            let html = `
                <td class="p-3 text-gray-800 font-medium">${row.property}</td>
                <td class="p-3 text-gray-600">${row.owner}</td>
                <td class="p-3 text-gray-600">${row.address}</td>
                <td class="p-3 text-gray-800">${row.tenantName}</td>
                <td class="p-3 text-right font-medium text-gray-900">$${(row.expectedRent||0).toFixed(2)}</td>
            `;

            for (var m = 0; m < 12; m++) {
                if (!row.activeMonths[m]) {
                    html += `<td class="p-3 text-center bg-gray-100 text-gray-400 text-xs">-</td>`;
                } else {
                    const paid = row.payments[m] || 0;
                    const expected = row.expectedRent || 0;
                    let bgClass = "bg-red-50 hover:bg-red-100 text-red-700 cursor-pointer border border-red-100";
                    let diffText = ``;

                    if (paid >= expected && expected > 0) {
                        bgClass = "bg-green-50 hover:bg-green-100 text-green-700 cursor-pointer border border-green-100";
                    } else if (paid > 0) {
                        bgClass = "bg-yellow-50 hover:bg-yellow-100 text-yellow-700 cursor-pointer border border-yellow-100";
                        diffText = `<br><span class="text-[10px]">-$${(expected-paid).toFixed(2)}</span>`;
                    }

                    html += `<td class="p-1 text-center">
                        <div class="h-full w-full rounded p-1.5 flex flex-col items-center justify-center ${bgClass}"
                             onclick="openRentPaymentModal('${row.leaseId}', '${row.tenantId}', '${row.property}', '${row.tenantName}', ${m}, ${expected})">
                             <div class="font-medium">$${paid.toFixed(0)}</div>
                             ${diffText}
                        </div>
                    </td>`;
                }
            }
            tr.innerHTML = html;
            tbody.appendChild(tr);
        });
    }

        employees: { title: "Bulk Add Employees", functionName: "addEmployeesBulk", columns: [ { key: "employeeId", label: "Employee ID (blank for auto)", type: "text", required: false }, { key: "fullName", label: "Full Name*", type: "text", required: true }, { key: "email", label: "Email*", type: "email", required: true }, { key: "phoneNumber", label: "Phone Number", type: "text", required: false }, { key: "hourlyPayRate", label: "Hourly Pay Rate ($)*", type: "number", required: true, step: "0.01", min: "0" }, { key: "role", label: "Role", type: "select", options: ["Field Crew", "Admin", "Owner"], default: "Field Crew" }, { key: "status", label: "Status", type: "select", options: ["Active", "Inactive"], default: "Active" } ] },
        tasks: { title: "Bulk Add Task Categories", functionName: "addTasksBulk", columns: [ { key: "taskName", label: "Task Name*", type: "text", required: true }, { key: "description", label: "Description", type: "text", required: false }, { key: "isBillable", label: "Is Billable?", type: "select", options: ["Yes", "No"], default: "Yes" } ] }
    };

    function openBulkAddModal(entityType) {
        document.getElementById('bulk-entity-type').value = entityType;
        const config = BULK_CONFIG[entityType];
        document.getElementById('bulk-modal-title').innerText = config.title;

        let theadHtml = '<tr>';
        config.columns.forEach(col => { theadHtml += `<th class="py-3 px-4 font-semibold">${col.label}</th>`; });
        theadHtml += '<th class="py-3 px-2"></th></tr>'; 
        document.getElementById('bulk-table-head').innerHTML = theadHtml;

        document.getElementById('bulk-table-body').innerHTML = '';
        for (var i = 0; i < 5; i++) { addBulkRow(entityType); }

        const modal = document.getElementById('bulk-add-modal');
        modal.classList.remove('hidden');
        setTimeout(() => modal.classList.remove('opacity-0', 'scale-95'), 10);
    }

    function closeBulkAddModal() {
        const modal = document.getElementById('bulk-add-modal');
        modal.classList.add('opacity-0', 'scale-95');
        setTimeout(() => modal.classList.add('hidden'), 300);
    }

    function addBulkRow(overrideEntityType = null) {
        const entityType = overrideEntityType || document.getElementById('bulk-entity-type').value;
        const config = BULK_CONFIG[entityType];
        const tbody = document.getElementById('bulk-table-body');
        const row = document.createElement('tr');
        row.className = 'bulk-row hover:bg-gray-50';

        let rowHtml = '';
        config.columns.forEach(col => {
            rowHtml += `<td class="p-2 align-top">`;
            if (col.type === 'select') {
                rowHtml += `<select data-key="${col.key}" class="w-full rounded border-gray-300 border p-1.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none bg-white">`;
                col.options.forEach(opt => { rowHtml += `<option value="${opt}" ${opt === col.default ? 'selected' : ''}>${opt}</option>`; });
                rowHtml += `</select>`;
            } else {
                const stepMin = col.type === 'number' ? `step="${col.step}" min="${col.min}"` : '';
                rowHtml += `<input type="${col.type}" data-key="${col.key}" data-required="${col.required}" ${stepMin} class="w-full rounded border-gray-300 border p-1.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none bg-white placeholder-gray-400">`;
            }
            rowHtml += `</td>`;
        });
        rowHtml += `<td class="p-2 align-top text-center"><button type="button" onclick="this.closest('tr').remove()" class="text-red-500 hover:text-red-700 mt-1"><i class="fas fa-trash"></i></button></td>`;
        row.innerHTML = rowHtml;
        tbody.appendChild(row);
    }

    function submitBulkAdd(e) {
        e.preventDefault();
        const entityType = document.getElementById('bulk-entity-type').value;
        const config = BULK_CONFIG[entityType];
        const rows = document.querySelectorAll('#bulk-table-body .bulk-row');
        const payloads = [];
        let hasError = false;

        document.querySelectorAll('.bulk-row input, .bulk-row select').forEach(el => el.classList.remove('border-red-500', 'bg-red-50'));

        rows.forEach(row => {
            const inputs = row.querySelectorAll('input, select');
            const rowData = {};
            let isRowEmpty = true;
            let isRowMissingRequired = false;

            inputs.forEach(input => {
                const key = input.getAttribute('data-key');
                const val = input.value.trim();
                if (input.tagName === 'INPUT' && val !== '') isRowEmpty = false;
                rowData[key] = val;
            });

            if (!isRowEmpty) {
                inputs.forEach(input => {
                    const isRequired = input.getAttribute('data-required') === 'true';
                    const val = input.value.trim();
                    if (isRequired && val === '') {
                        isRowMissingRequired = true;
                        input.classList.add('border-red-500', 'bg-red-50');
                    }
                });

                if (isRowMissingRequired) {
                    hasError = true;
                } else {
                    if (entityType === 'tasks' && 'isBillable' in rowData) rowData.isBillable = rowData.isBillable === 'Yes';
                    payloads.push(rowData);
                }
            }
        });

        if (hasError) { showToast("Please fill in all required fields for non-empty rows.", "error"); return; }
        if (payloads.length === 0) { showToast("No data to save.", "warning"); return; }

        const btn = document.getElementById('submit-bulk-btn');
        const originalText = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
        btn.disabled = true;

        if (config.functionName === 'addBillingRatesBulk') {
            google.script.run.withSuccessHandler(handleBulkRes).withFailureHandler(handleBulkErr).addBillingRatesBulk(payloads);
        } else if (config.functionName === 'addPropertiesBulk') {
            google.script.run.withSuccessHandler(handleBulkRes).withFailureHandler(handleBulkErr).addPropertiesBulk(payloads);
        } else if (config.functionName === 'addEmployeesBulk') {
            google.script.run.withSuccessHandler(handleBulkRes).withFailureHandler(handleBulkErr).addEmployeesBulk(payloads);
        } else if (config.functionName === 'addTasksBulk') {
            google.script.run.withSuccessHandler(handleBulkRes).withFailureHandler(handleBulkErr).addTasksBulk(payloads);
        }

        function handleBulkRes(res) {
            btn.innerHTML = originalText;
            btn.disabled = false;
            if (res.success) {
                showToast(res.message, 'success');
                closeBulkAddModal();
                if (entityType === 'rates') loadRates();
                if (entityType === 'properties') loadProperties();
                if (entityType === 'employees') loadEmployees();
                if (entityType === 'tasks') loadTasks();
            } else showToast("Error: " + res.error, 'error');
        }

        function handleBulkErr(err) {
            btn.innerHTML = originalText;
            btn.disabled = false;
            showToast("Connection error: " + err.message, "error");
        }
    }
</script>
