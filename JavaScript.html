    <script>
        let materialCount = 0;
        let currentRole = 'employee';
        let validProperties = [];
        let validTasks = [];
        let bypassPropertyWarning = false;
        let activeInvoiceProperty = null;
        let userPunchesCache = [];

        document.getElementById('log-date').valueAsDate = new Date();

        // Environment Runner
        const mockGoogleScriptRun = {
            withSuccessHandler: function(callback) {
                return {
                    getDropdownData: function() {
                        setTimeout(() => {
                            callback({
                                properties: ["Alpha Phi", "4638 B", "645 Ber", "Company Office"],
                                tasks: ["Handyman", "Plumbing", "Painting", "Lawn Care", "Materials Run"]
                            });
                        }, 300);
                    },
                    submitWorkLog: function(payload) {
                        setTimeout(() => callback({ success: true }), 500);
                    },
                    getUserRole: function() {
                        setTimeout(() => callback({ role: 'admin', employeeId: 'EMP-001', name: 'Brian Gross' }), 300);
                    },
                    getEmployeeWorkLogs: function() {
                        setTimeout(() => callback({
                            success: true,
                            employeeName: 'Brian Gross',
                            dailySummary: [
                                { date: '2026-09-12', totalHours: 6.5 },
                                { date: '2026-09-11', totalHours: 8.0 }
                            ],
                            punches: [
                                { workLogId: '1', dateCompleted: '2026-09-12', propertyId: 'Alpha Phi', taskId: 'Lawn/Landscaping', hoursWorked: 2.0, workNotes: 'Mowed lawn', payrollStatus: 'Pending', billingStatus: 'Unbilled' },
                                { workLogId: '2', dateCompleted: '2026-09-12', propertyId: '4638 B', taskId: 'Plumbing', hoursWorked: 4.5, workNotes: 'Fixed sink pipe leak', payrollStatus: 'Approved', billingStatus: 'Unbilled' },
                                { workLogId: '3', dateCompleted: '2026-09-11', propertyId: 'Company Office', taskId: 'Handyman', hoursWorked: 8.0, workNotes: 'Repaired door hinges', payrollStatus: 'Paid', billingStatus: 'Billed' }
                            ]
                        }), 300);
                    },
                    updateWorkLog: function(payload) {
                        setTimeout(() => callback({ success: true, message: 'Punch updated successfully' }), 400);
                    },
                    updateApprovalStatus: function(workLogId, status) {
                        setTimeout(() => callback({ success: true, message: 'Status updated to ' + status }), 300);
                    },
                    getAdminPayrollData: function(startDate, endDate, statusFilter) {
                        setTimeout(() => {
                            callback({
                                success: true,
                                metrics: {
                                    pendingPayrollHours: 15.0,
                                    pendingPayrollGrossPay: 525.00,
                                    approvedPayrollHours: 27.5,
                                    approvedPayrollGrossPay: 687.50,
                                    unbilledMaterialsCost: 1240.50,
                                    unbilledLaborCost: 1212.50,
                                    totalUnbilledInvoiceAmount: 2453.00,
                                    totalLogs: 14
                                },
                                workLogs: [
                                    { workLogId: '1', dateCompleted: '2026-09-12', employeeName: 'Brian Gross', propertyId: 'Alpha Phi', taskId: 'Lawn/Landscaping', hoursWorked: 2.0, workNotes: 'Mowed lawn', payrollStatus: 'Pending', grossPay: 70.00 },
                                    { workLogId: '2', dateCompleted: '2026-09-12', employeeName: 'Jason R.', propertyId: '4638 B', taskId: 'Plumbing', hoursWorked: 4.5, workNotes: 'Pipe leak repair', payrollStatus: 'Approved', grossPay: 112.50 }
                                ],
                                employeeSummaries: [
                                    { employeeId: 'EMP-001', name: 'Brian Gross', payRate: 35.00, approvedHours: 15.0, approvedGrossPay: 525.00 },
                                    { employeeId: 'EMP-002', name: 'Jason R.', payRate: 25.00, approvedHours: 27.5, approvedGrossPay: 687.50 }
                                ],
                                propertySummaries: [
                                    { propertyId: 'Alpha Phi', unbilledHours: 18.0, unbilledLaborCost: 550.00, unbilledMaterialsCost: 420.00, totalUnbilled: 970.00 },
                                    { propertyId: '4638 B', unbilledHours: 12.5, unbilledLaborCost: 387.50, unbilledMaterialsCost: 820.50, totalUnbilled: 1208.00 }
                                ]
                            });
                        }, 400);
                    },
                    markPayrollPaid: function(empId) {
                        setTimeout(() => callback({ success: true, message: 'Payroll updated' }), 400);
                    },
                    generateInvoiceReport: function(propId) {
                        setTimeout(() => {
                            callback({
                                success: true,
                                invoice: {
                                    propertyId: propId,
                                    invoiceDate: new Date().toLocaleDateString(),
                                    laborItems: [
                                        { dateCompleted: '2026-09-10', employeeName: 'Jason R.', taskId: 'Plumbing', hoursWorked: 4, grossPay: 100, workNotes: 'Replaced sink valves' },
                                        { dateCompleted: '2026-09-11', employeeName: 'Brian Gross', taskId: 'Electrical', hoursWorked: 3, grossPay: 105, workNotes: 'Installed breaker box' }
                                    ],
                                    materialItems: [
                                        { vendor: 'Home Depot', description: 'PVC Pipe fittings', cost: 85.50, receiptUrl: '#' },
                                        { vendor: 'Lowe\'s', description: 'Circuit panel switch', cost: 150.00, receiptUrl: '#' }
                                    ],
                                    totalHours: 7,
                                    totalLaborCost: 205.00,
                                    totalMaterialsCost: 235.50,
                                    grandTotal: 440.50
                                }
                            });
                        }, 400);
                    },
                    exportInvoicePDF: function(propId) {
                        setTimeout(() => {
                            callback({
                                success: true,
                                docUrl: '#',
                                pdfUrl: '#',
                                fileName: 'Invoice - ' + propId + '.pdf',
                                base64Pdf: ''
                            });
                        }, 800);
                    },
                    markPropertyBilled: function(propId) {
                        setTimeout(() => callback({ success: true, message: 'Property billed' }), 400);
                    }
                };
            }
        };
        const scriptRunner = (typeof google !== 'undefined' && google.script) ? google.script.run : mockGoogleScriptRun;

        window.onload = function() {
            scriptRunner.withSuccessHandler(populateDatalists).getDropdownData();
            scriptRunner.withSuccessHandler(function(userInfo) {
                if(userInfo && userInfo.name) {
                    document.getElementById('user-name-display').innerText = userInfo.name;
                    document.getElementById('user-role-display').innerText = userInfo.role === 'admin' ? 'Admin' : 'Field Crew';
                    document.getElementById('user-avatar').innerText = userInfo.name.charAt(0);
                    if(userInfo.role === 'admin') {
                        document.getElementById('role-simulator').value = 'admin';
                        switchRole('admin');
                    }
                }
            }).getUserRole();
        };

        function populateDatalists(data) {
            validProperties = data.properties;
            validTasks = data.tasks;

            const propList = document.getElementById('property-list');
            propList.innerHTML = '';
            validProperties.forEach(prop => propList.insertAdjacentHTML('beforeend', `<option value="${prop}">`));

            const taskList = document.getElementById('task-list');
            taskList.innerHTML = '';
            validTasks.forEach(task => taskList.insertAdjacentHTML('beforeend', `<option value="${task}">`));
        }

        function switchRole(role) {
            currentRole = role;
            const adminTab = document.getElementById('tab-admin-view');
            if (role === 'admin') {
                adminTab.classList.remove('hidden');
                document.getElementById('tab-lease-view').classList.remove('hidden');
                document.getElementById('tab-settings-view').classList.remove('hidden');
                document.getElementById('charge-target-container').classList.remove('hidden');
                loadLeasesAndTenants();
            } else {
                adminTab.classList.add('hidden');
                document.getElementById('tab-lease-view').classList.add('hidden');
                document.getElementById('tab-settings-view').classList.add('hidden');
                document.getElementById('charge-target-container').classList.add('hidden');
                if (!document.getElementById('admin-view').classList.contains('hidden') || !document.getElementById('lease-view').classList.contains('hidden') || !document.getElementById('settings-view').classList.contains('hidden')) {
                    switchTab('employee-view');
                }
            }
        }

        function switchTab(tabId) {
            document.getElementById('employee-view').classList.add('hidden');
            document.getElementById('history-view').classList.add('hidden');
            document.getElementById('admin-view').classList.add('hidden');
            document.getElementById('lease-view').classList.add('hidden');
            document.getElementById('settings-view').classList.add('hidden');

            ['employee-view', 'history-view', 'admin-view', 'lease-view', 'settings-view'].forEach(t => {
                const el = document.getElementById(`tab-${t}`);
                if(el) {
                    el.classList.remove('border-blue-600', 'text-blue-600');
                    el.classList.add('border-transparent', 'text-gray-500');
                }
            });

            document.getElementById(tabId).classList.remove('hidden');

            if (tabId === 'settings-view') {
                loadRates();
            }
            const activeTabEl = document.getElementById(`tab-${tabId}`);
            if(activeTabEl) {
                activeTabEl.classList.remove('border-transparent', 'text-gray-500');
                activeTabEl.classList.add('border-blue-600', 'text-blue-600');
            }

            if(tabId === 'history-view') {
                loadEmployeeHistory();
            } else if(tabId === 'admin-view') {
                loadAdminDashboardData();
            }
        }

        // --- EMPLOYEE HISTORY & EDIT PUNCHES ---
        function loadEmployeeHistory() {
            scriptRunner.withSuccessHandler(renderEmployeeHistory).getEmployeeWorkLogs();
        }

        function renderEmployeeHistory(res) {
            if(!res || !res.success) {
                showToast('Error', res ? res.error : 'Failed to load punch history', 'error');
                return;
            }

            userPunchesCache = res.punches || [];

            // Daily Summary Cards
            const summaryContainer = document.getElementById('daily-summary-container');
            summaryContainer.innerHTML = '';
            if(!res.dailySummary || res.dailySummary.length === 0) {
                summaryContainer.innerHTML = '<p class="col-span-full text-center text-gray-400 py-3 text-sm">No daily hours logged yet.</p>';
            } else {
                res.dailySummary.forEach(item => {
                    summaryContainer.insertAdjacentHTML('beforeend', `
                        <div class="bg-gray-50 border border-gray-200 rounded-lg p-3 text-center">
                            <p class="text-xs text-gray-500 font-medium">${item.date}</p>
                            <p class="text-lg font-bold text-blue-600 mt-1">${item.totalHours.toFixed(2)} <span class="text-xs font-normal text-gray-600">hrs</span></p>
                        </div>
                    `);
                });
            }

            // Punch Log List
            const punchesContainer = document.getElementById('punches-list-container');
            punchesContainer.innerHTML = '';
            if(!res.punches || res.punches.length === 0) {
                punchesContainer.innerHTML = '<p class="text-center text-gray-400 py-8 text-sm">No previous punches recorded.</p>';
            } else {
                res.punches.forEach((punch) => {
                    const statusLower = punch.payrollStatus.toLowerCase();
                    let statusClass = 'bg-yellow-100 text-yellow-800 border-yellow-200';
                    if (statusLower === 'approved') statusClass = 'bg-blue-100 text-blue-700 border-blue-200';
                    if (statusLower === 'paid') statusClass = 'bg-green-100 text-green-700 border-green-200';
                    if (statusLower === 'rejected') statusClass = 'bg-red-100 text-red-700 border-red-200';

                    const isPaid = statusLower === 'paid';

                    punchesContainer.insertAdjacentHTML('beforeend', `
                        <div class="p-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 hover:bg-gray-50 transition-colors">
                            <div class="space-y-1">
                                <div class="flex items-center gap-2">
                                    <span class="font-semibold text-gray-900">${punch.propertyId}</span>
                                    <span class="text-xs px-2 py-0.5 rounded-full border font-medium ${statusClass}">${punch.payrollStatus}</span>
                                </div>
                                <p class="text-xs text-gray-600"><span class="font-medium text-gray-800">${punch.taskId}</span> &bull; ${punch.workNotes}</p>
                                <p class="text-xs text-gray-400"><i class="far font-medium fa-calendar mr-1"></i>${punch.dateCompleted}</p>
                            </div>
                            <div class="flex items-center gap-4 w-full sm:w-auto justify-between sm:justify-end border-t sm:border-0 pt-2 sm:pt-0">
                                <span class="font-bold text-gray-800 text-sm">${punch.hoursWorked.toFixed(2)} hrs</span>
                                <button onclick="openEditModal('${punch.workLogId}')" ${isPaid ? 'disabled' : ''} class="text-xs px-3 py-1.5 bg-blue-600 hover:bg-blue-700 disabled:bg-gray-200 disabled:text-gray-400 text-white font-medium rounded-lg shadow-sm transition-colors flex items-center gap-1">
                                    <i class="fas fa-edit"></i> Edit
                                </button>
                            </div>
                        </div>
                    `);
                });
            }
        }

        function openEditModal(workLogId) {
            const punch = userPunchesCache.find(p => p.workLogId === workLogId);
            if (!punch) return;

            document.getElementById('edit-work-log-id').value = punch.workLogId;
            document.getElementById('edit-log-date').value = punch.dateCompleted;
            document.getElementById('edit-log-property').value = punch.propertyId;
            document.getElementById('edit-log-task').value = punch.taskId;
            document.getElementById('edit-log-hours').value = punch.hoursWorked;
            document.getElementById('edit-log-notes').value = punch.workNotes;

            const modal = document.getElementById('edit-punch-modal');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                document.getElementById('edit-modal-content').classList.remove('scale-95');
            }, 10);
        }

        function closeEditModal() {
            const modal = document.getElementById('edit-punch-modal');
            modal.classList.add('opacity-0');
            document.getElementById('edit-modal-content').classList.add('scale-95');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        function submitPunchEdit(e) {
            if(e) e.preventDefault();

            const btn = document.getElementById('save-edit-btn');
            const originalBtnText = btn.innerText;
            btn.innerText = "Saving...";
            btn.disabled = true;

            const payload = {
                workLogId: document.getElementById('edit-work-log-id').value,
                date: document.getElementById('edit-log-date').value,
                propertyId: document.getElementById('edit-log-property').value.trim(),
                taskId: document.getElementById('edit-log-task').value.trim(),
                hours: parseFloat(document.getElementById('edit-log-hours').value),
                notes: document.getElementById('edit-log-notes').value
            };

            scriptRunner.withSuccessHandler(function(res) {
                btn.innerText = originalBtnText;
                btn.disabled = false;

                if (res.success) {
                    showToast('Success', 'Punch log updated successfully.', 'success');
                    closeEditModal();
                    loadEmployeeHistory();
                } else {
                    showToast('Error', res.error, 'error');
                }
            }).updateWorkLog(payload);
        }

        // --- PAY PERIOD FILTER HELPERS ---
        function setPayPeriodFilter(type) {
            const startInput = document.getElementById('admin-start-date');
            const endInput = document.getElementById('admin-end-date');
            const now = new Date();

            if (type === 'all') {
                startInput.value = '';
                endInput.value = '';
            } else if (type === 'current') {
                const dayOfWeek = now.getDay();
                const start = new Date(now);
                start.setDate(now.getDate() - dayOfWeek - 7); // Start of 2-week block
                startInput.valueAsDate = start;
                endInput.valueAsDate = now;
            } else if (type === 'previous') {
                const start = new Date(now);
                start.setDate(now.getDate() - 28);
                const end = new Date(now);
                end.setDate(now.getDate() - 14);
                startInput.valueAsDate = start;
                endInput.valueAsDate = end;
            }
            loadAdminDashboardData();
        }

        // --- ADMIN DASHBOARD CALCULATIONS & RENDERING ---
        function loadAdminDashboardData() {
            const startDate = document.getElementById('admin-start-date').value;
            const endDate = document.getElementById('admin-end-date').value;
            const statusFilter = document.getElementById('admin-status-filter').value;

            scriptRunner.withSuccessHandler(renderAdminDashboard).getAdminPayrollData(startDate, endDate, statusFilter);
        }

        function renderAdminDashboard(res) {
            if(!res || !res.success) {
                showToast('Error', res ? res.error : 'Failed to fetch payroll data', 'error');
                return;
            }

            const m = res.metrics;
            document.getElementById('stat-pending-amount').innerText = '$' + (m.pendingPayrollGrossPay || 0).toFixed(2);
            document.getElementById('stat-pending-hours').innerText = (m.pendingPayrollHours || 0).toFixed(1) + ' hrs pending';

            document.getElementById('stat-payroll-amount').innerText = '$' + (m.approvedPayrollGrossPay || 0).toFixed(2);
            document.getElementById('stat-payroll-hours').innerText = (m.approvedPayrollHours || 0).toFixed(1) + ' hrs approved';

            document.getElementById('stat-materials-amount').innerText = '$' + (m.unbilledMaterialsCost || 0).toFixed(2);
            document.getElementById('stat-unbilled-total').innerText = '$' + (m.totalUnbilledInvoiceAmount || 0).toFixed(2);

            // Render Approval Work Logs Table
            const approvalTbody = document.getElementById('approval-tbody');
            approvalTbody.innerHTML = '';
            if(!res.workLogs || res.workLogs.length === 0) {
                approvalTbody.innerHTML = '<tr><td colspan="8" class="py-6 text-center text-gray-400">No work logs found for selected filters.</td></tr>';
            } else {
                res.workLogs.forEach(log => {
                    const statusLower = log.payrollStatus.toLowerCase();
                    let badgeClass = 'bg-yellow-100 text-yellow-800 border-yellow-200';
                    if(statusLower === 'approved') badgeClass = 'bg-blue-100 text-blue-700 border-blue-200';
                    if(statusLower === 'paid') badgeClass = 'bg-green-100 text-green-700 border-green-200';
                    if(statusLower === 'rejected') badgeClass = 'bg-red-100 text-red-700 border-red-200';

                    const isPaid = statusLower === 'paid';

                    approvalTbody.insertAdjacentHTML('beforeend', `
                        <tr class="hover:bg-gray-50 border-b">
                            <td class="py-3 px-4 font-medium">${log.dateCompleted}</td>
                            <td class="py-3 px-4 font-medium text-gray-900">${log.employeeName}</td>
                            <td class="py-3 px-4"><span class="font-semibold text-gray-800">${log.propertyId}</span> <span class="text-gray-400">&bull; ${log.taskId}</span></td>
                            <td class="py-3 px-4 font-bold text-gray-800">${log.hoursWorked.toFixed(2)} hrs</td>
                            <td class="py-3 px-4 text-gray-500 max-w-xs truncate">${log.workNotes}</td>
                            <td class="py-3 px-4 font-medium">${log.chargeTarget || 'Owner'}</td>
                            <td class="py-3 px-4"><span class="px-2 py-0.5 rounded-full border text-xs font-semibold ${badgeClass}">${log.payrollStatus}</span></td>
                            <td class="py-3 px-4 text-right">
                                <div class="flex justify-end gap-1">
                                    <button onclick="setApprovalStatus('${log.workLogId}', 'Approved')" ${isPaid || statusLower === 'approved' ? 'disabled' : ''} class="px-2 py-1 bg-green-600 hover:bg-green-700 disabled:bg-gray-200 disabled:text-gray-400 text-white font-medium rounded transition-colors text-xs">
                                        Approve
                                    </button>
                                    <button onclick="setApprovalStatus('${log.workLogId}', 'Rejected')" ${isPaid || statusLower === 'rejected' ? 'disabled' : ''} class="px-2 py-1 bg-red-600 hover:bg-red-700 disabled:bg-gray-200 disabled:text-gray-400 text-white font-medium rounded transition-colors text-xs">
                                        Reject
                                    </button>
                                </div>
                            </td>
                        </tr>
                    `);
                });
            }

            // Render Payroll Table
            const payrollTbody = document.getElementById('payroll-tbody');
            payrollTbody.innerHTML = '';
            if(!res.employeeSummaries || res.employeeSummaries.length === 0) {
                payrollTbody.innerHTML = '<tr><td colspan="5" class="py-4 text-center text-gray-400">No employees found.</td></tr>';
            } else {
                res.employeeSummaries.forEach(emp => {
                    payrollTbody.insertAdjacentHTML('beforeend', `
                        <tr class="hover:bg-gray-50">
                            <td class="py-3 px-4 font-medium text-gray-900">${emp.name} <span class="text-xs text-gray-400">(${emp.employeeId})</span></td>
                            <td class="py-3 px-4">$${emp.payRate.toFixed(2)}/hr</td>
                            <td class="py-3 px-4">${emp.approvedHours.toFixed(1)} hrs</td>
                            <td class="py-3 px-4 font-semibold text-gray-800">$${emp.approvedGrossPay.toFixed(2)}</td>
                            <td class="py-3 px-4 text-right">
                                <button onclick="markEmployeePayrollPaid('${emp.employeeId}')" ${emp.approvedHours === 0 ? 'disabled' : ''} class="text-xs px-3 py-1.5 bg-green-600 hover:bg-green-700 disabled:bg-gray-200 text-white font-medium rounded-lg shadow-sm transition-colors">
                                    Mark Paid
                                </button>
                            </td>
                        </tr>
                    `);
                });
            }

            // Render Property Cards
            const propContainer = document.getElementById('property-cards-container');
            propContainer.innerHTML = '';
            if(!res.propertySummaries || res.propertySummaries.length === 0) {
                propContainer.innerHTML = '<p class="col-span-2 text-center text-gray-400 py-4">No unbilled property items found.</p>';
            } else {
                res.propertySummaries.forEach(prop => {
                    propContainer.insertAdjacentHTML('beforeend', `
                        <div class="border rounded-xl p-4 bg-gray-50 flex flex-col justify-between space-y-3">
                            <div class="flex justify-between items-start">
                                <div>
                                    <h3 class="font-bold text-gray-900 text-base">${prop.propertyId}</h3>
                                    <p class="text-xs text-gray-500">${prop.unbilledHours.toFixed(1)} unbilled hrs</p>
                                </div>
                                <span class="text-sm font-bold text-blue-600 bg-blue-50 border border-blue-200 px-2.5 py-1 rounded-lg">
                                    $${prop.totalUnbilled.toFixed(2)}
                                </span>
                            </div>
                            <div class="text-xs text-gray-600 space-y-1">
                                <div class="flex justify-between"><span>Labor:</span><span>$${prop.unbilledLaborCost.toFixed(2)}</span></div>
                                <div class="flex justify-between"><span>Materials:</span><span>$${prop.unbilledMaterialsCost.toFixed(2)}</span></div>
                            </div>
                            <button onclick="openInvoiceReport('${prop.propertyId}')" class="w-full text-xs py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg shadow-sm transition-colors flex justify-center items-center gap-1">
                                <i class="fas fa-receipt"></i> Generate Invoice Report
                            </button>
                        </div>
                    `);
                });
            }
        }


        // --- BILLING RATES MANAGEMENT ---
        function loadRates() {
            const tbody = document.getElementById('rates-table-body');
            tbody.innerHTML = '<tr><td colspan="4" class="py-6 text-center text-gray-400">Loading rates...</td></tr>';

            scriptRunner.withSuccessHandler(function(rates) {
                tbody.innerHTML = '';
                if (!rates || rates.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="py-6 text-center text-gray-500">No custom billing rates configured. Using employee base pay rates.</td></tr>';
                    return;
                }

                rates.forEach(rate => {
                    tbody.insertAdjacentHTML('beforeend', `
                        <tr class="hover:bg-gray-50 border-b">
                            <td class="py-3 px-4 font-medium">${rate.taskName} <span class="text-xs text-gray-400 font-normal">(${rate.taskId})</span></td>
                            <td class="py-3 px-4">${rate.employeeName} <span class="text-xs text-gray-400">(${rate.employeeId})</span></td>
                            <td class="py-3 px-4 text-right font-semibold text-gray-900">$${parseFloat(rate.rate).toFixed(2)}</td>
                            <td class="py-3 px-4 text-center">
                                <button onclick='editRate(${JSON.stringify(rate).replace(/'/g, "\\'")})' class="text-blue-600 hover:text-blue-800 mr-3"><i class="fas fa-edit"></i></button>
                                <button onclick="deleteRate('${rate.rateId}')" class="text-red-500 hover:text-red-700"><i class="fas fa-trash"></i></button>
                            </td>
                        </tr>
                    `);
                });
            }).getBillingRates();
        }

        function openRateModal() {
            document.getElementById('rate-id').value = '';
            document.getElementById('rate-task-id').value = '';
            document.getElementById('rate-employee-id').value = '';
            document.getElementById('rate-amount').value = '';
            document.getElementById('rate-modal-title').innerText = 'Add Billing Rate';

            const modal = document.getElementById('rate-modal');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modal.querySelector('div').classList.remove('scale-95');
            }, 10);
        }

        function editRate(rate) {
            document.getElementById('rate-id').value = rate.rateId;
            document.getElementById('rate-task-id').value = rate.taskId;
            document.getElementById('rate-employee-id').value = rate.employeeId;
            document.getElementById('rate-amount').value = rate.rate;
            document.getElementById('rate-modal-title').innerText = 'Edit Billing Rate';

            const modal = document.getElementById('rate-modal');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modal.querySelector('div').classList.remove('scale-95');
            }, 10);
        }

        function closeRateModal() {
            const modal = document.getElementById('rate-modal');
            modal.classList.add('opacity-0');
            modal.querySelector('div').classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        function submitRate(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-rate-btn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Saving...';
            btn.disabled = true;

            const payload = {
                rateId: document.getElementById('rate-id').value,
                taskId: document.getElementById('rate-task-id').value.trim(),
                employeeId: document.getElementById('rate-employee-id').value.trim(),
                rate: parseFloat(document.getElementById('rate-amount').value)
            };

            if (payload.rateId) {
                scriptRunner.withSuccessHandler(res => {
                    handleRateResponse(res, btn, originalText);
                }).updateBillingRate(payload);
            } else {
                scriptRunner.withSuccessHandler(res => {
                    handleRateResponse(res, btn, originalText);
                }).addBillingRate(payload);
            }
        }

        function handleRateResponse(res, btn, originalText) {
            btn.innerHTML = originalText;
            btn.disabled = false;
            if (res.success) {
                showToast('Success', res.message, 'success');
                closeRateModal();
                loadRates();
            } else {
                showToast('Error', res.error, 'error');
            }
        }

        function deleteRate(rateId) {

                    if (res.success) {
                        showToast('Success', 'Rate deleted', 'success');
                        loadRates();
                    } else {
                        showToast('Error', res.error, 'error');
                    }
                }).deleteBillingRate(rateId);
            }
        }
        function setApprovalStatus(workLogId, status) {
            scriptRunner.withSuccessHandler(function(res) {
                if(res.success) {
                    showToast('Updated', res.message, 'success');

                } else {
                    showToast('Error', res.error, 'error');
                }
            }).updateApprovalStatus(workLogId, status);

        function markEmployeePayrollPaid(empId) {
            scriptRunner.withSuccessHandler(function(res) {
                if(res.success) {
                    showToast('Success', 'Payroll status updated to Paid.', 'success');
                    loadAdminDashboardData();
                } else {
                    showToast('Error', res.error, 'error');

            }).markPayrollPaid(empId);

        function openInvoiceReport(propertyId) {
            activeInvoiceProperty = propertyId;
            document.getElementById('export-links-container').classList.add('hidden');

            scriptRunner.withSuccessHandler(function(res) {
                if(!res.success) {
                    showToast('Error', res.error, 'error');
                    return;
                }
                const inv = res.invoice;
                document.getElementById('inv-modal-property').innerText = 'Invoice Report: ' + inv.propertyId;
                document.getElementById('inv-modal-date').innerText = 'Generated on ' + inv.invoiceDate;

                // Populate Labor Table
                const laborTbody = document.getElementById('inv-labor-tbody');
                laborTbody.innerHTML = '';
                if(inv.laborItems.length === 0) {
                    laborTbody.innerHTML = '<tr><td colspan="6" class="p-2 text-center text-gray-400">No unbilled labor logs.</td></tr>';
                } else {
                    inv.laborItems.forEach(item => {
                        laborTbody.insertAdjacentHTML('beforeend', `
                            <tr>
                                <td class="p-2 border-b text-xs">${item.dateCompleted}</td>
                                <td class="p-2 border-b text-xs font-medium">${item.employeeName}</td>
                                <td class="p-2 border-b text-xs">${item.taskId} - ${item.workNotes}</td>
                                <td class="p-2 border-b text-xs font-medium">${item.chargeTarget || 'Owner'}</td>
                                <td class="p-2 border-b text-xs text-right">${item.hoursWorked}</td>
                                <td class="p-2 border-b text-xs text-right font-medium">$${item.billableAmount !== undefined ? item.billableAmount.toFixed(2) : (item.grossPay || 0).toFixed(2)}</td>
                            </tr>
                        `);
                    });
                }

                // Populate Materials Table
                const matTbody = document.getElementById('inv-materials-tbody');
                matTbody.innerHTML = '';
                if(inv.materialItems.length === 0) {
                    matTbody.innerHTML = '<tr><td colspan="4" class="p-2 text-center text-gray-400">No material expenses.</td></tr>';
                } else {
                    inv.materialItems.forEach(mat => {
                        const receiptBtn = mat.receiptUrl
                            ? `<a href="${mat.receiptUrl}" target="_blank" class="text-xs text-blue-600 hover:underline"><i class="fas fa-paperclip mr-1"></i>View File</a>`
                            : `<span class="text-xs text-gray-400">None</span>`;

                        matTbody.insertAdjacentHTML('beforeend', `
                            <tr>
                                <td class="p-2 border-b text-xs font-medium">${mat.vendor}</td>
                                <td class="p-2 border-b text-xs">${mat.description}</td>
                                <td class="p-2 border-b text-xs text-right font-medium">$${mat.cost.toFixed(2)}</td>
                                <td class="p-2 border-b text-xs text-center">${receiptBtn}</td>
                            </tr>
                        `);
                    });
                }

                document.getElementById('inv-total-labor').innerText = '$' + inv.totalLaborCost.toFixed(2);
                document.getElementById('inv-total-materials').innerText = '$' + inv.totalMaterialsCost.toFixed(2);
                document.getElementById('inv-grand-total').innerText = '$' + inv.grandTotal.toFixed(2);

                const modal = document.getElementById('invoice-modal');
                modal.classList.remove('hidden');
                setTimeout(() => {
                    modal.classList.remove('opacity-0');
                    document.getElementById('invoice-modal-content').classList.remove('scale-95');
                }, 10);
            }).generateInvoiceReport(propertyId);
        }

        function exportInvoicePDF() {
            if(!activeInvoiceProperty) return;

            const btn = document.getElementById('export-pdf-btn');
            const originalBtnHTML = btn.innerHTML;
            btn.innerHTML = `<i class="fas fa-spinner fa-spin text-red-500"></i> <span>Generating PDF...</span>`;
            btn.disabled = true;

            scriptRunner.withSuccessHandler(function(res) {
                btn.innerHTML = originalBtnHTML;
                btn.disabled = false;

                if(!res.success) {
                    showToast('Export Error', res.error, 'error');
                    return;
                }

                // Populate Links
                document.getElementById('link-doc-url').href = res.docUrl;
                document.getElementById('link-pdf-url').href = res.pdfUrl;
                document.getElementById('export-links-container').classList.remove('hidden');

                // Trigger automatic browser download if base64 data is present
                if(res.base64Pdf) {
                    const downloadLink = document.createElement('a');
                    downloadLink.href = 'data:application/pdf;base64,' + res.base64Pdf;
                    downloadLink.download = res.fileName;
                    document.body.appendChild(downloadLink);
                    downloadLink.click();
                    document.body.removeChild(downloadLink);
                }

                showToast('Export Complete', 'Invoice saved to Google Drive and downloaded.', 'success');
            }).exportInvoicePDF(activeInvoiceProperty);
        }

        function closeInvoiceModal() {
            const modal = document.getElementById('invoice-modal');
            modal.classList.add('opacity-0');
            document.getElementById('invoice-modal-content').classList.add('scale-95');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        function executeMarkBilled() {
            if(!activeInvoiceProperty) return;
            scriptRunner.withSuccessHandler(function(res) {
                if(res.success) {
                    showToast('Success', 'Invoice items marked as Billed.', 'success');
                    closeInvoiceModal();
                    loadAdminDashboardData();
                } else {
                    showToast('Error', res.error, 'error');
                }
            }).markPropertyBilled(activeInvoiceProperty);
        }

            materialCount++;

            const rowHTML = `

                            <option value="" disabled selected>Vendor...</option>
                            <option value="Home Depot">Home Depot</option>
                            <option value="Lowes">Lowe's</option>
                            <option value="Sherwin Williams">Sherwin Williams</option>
                            <option value="Menards">Menards</option>

                        </select>

                    </div>
                    <div class="w-full sm:w-32 space-y-2">
                        <input type="number" step="0.01" min="0.01" placeholder="$ Cost" required class="w-full rounded border-gray-300 border p-2 text-sm focus:ring-blue-500 outline-none material-cost" />
                        <div>
                            <label class="block text-[10px] text-gray-500 font-medium">Receipt Photo / PDF</label>

        function removeMaterialRow(rowId) {
            document.getElementById(rowId).remove();
            const container = document.getElementById('materials-container');
            if (container.children.length === 1 && container.children[0].id === 'no-materials-msg') {
                document.getElementById('no-materials-msg').style.display = 'block';
            }
        }

        function submitWorkLog(e) {
            if(e) e.preventDefault();
            const selectedProperty = document.getElementById('log-property').value.trim();
            if (!validProperties.includes(selectedProperty) && !bypassPropertyWarning) {
                showWarningModal(selectedProperty);
                return;
            }
            executeSubmission();
        }

        function showWarningModal(propertyName) {
            const modal = document.getElementById('confirmation-modal');
            document.getElementById('unlisted-prop-name').innerText = `"${propertyName}"`;
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                document.getElementById('modal-content').classList.remove('scale-95');
            }, 10);
        }

        function closeWarningModal(proceed) {
            const modal = document.getElementById('confirmation-modal');
            modal.classList.add('opacity-0');
            document.getElementById('modal-content').classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                if (proceed) {
                    bypassPropertyWarning = true;
                    submitWorkLog();
                } else {
                    document.getElementById('log-property').focus();
                }
            }, 300);
        }

        async function executeSubmission() {
            const btn = document.getElementById('submit-btn');
            const originalBtnHTML = btn.innerHTML;
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> <span>Saving & Uploading...</span>`;
            btn.disabled = true;

            const payload = {
                date: document.getElementById('log-date').value,
                propertyId: document.getElementById('log-property').value.trim(),
                taskId: document.getElementById('log-task').value.trim(),
                hours: parseFloat(document.getElementById('log-hours').value),
                notes: document.getElementById('log-notes').value,
                chargeTarget: currentRole === 'admin' ? document.getElementById('log-charge-target').value : 'Owner',
                materials: []
            };

            const materialRows = document.querySelectorAll('[id^="material-row-"]');

            for (let i = 0; i < materialRows.length; i++) {
                const row = materialRows[i];
                const vendor = row.querySelector('.material-vendor').value;
                const desc = row.querySelector('.material-desc').value;
                const cost = parseFloat(row.querySelector('.material-cost').value);
                const fileInput = row.querySelector('.material-file');

                let fileData = null;
                let fileName = null;
                let fileType = null;

                if (fileInput && fileInput.files && fileInput.files[0]) {
                    const file = fileInput.files[0];
                    fileName = file.name;
                    fileType = file.type;
                    fileData = await readFileAsBase64(file);
                }

                payload.materials.push({
                    vendor: vendor,
                    description: desc,
                    cost: cost,
                    fileData: fileData,
                    fileName: fileName,
                    fileType: fileType
                });
            }

            scriptRunner.withSuccessHandler(function(response) {
                document.getElementById('work-log-form').reset();
                document.getElementById('log-date').valueAsDate = new Date();
                bypassPropertyWarning = false;

                document.getElementById('materials-container').innerHTML = `<p id="no-materials-msg" class="text-sm text-gray-400 italic text-center py-2 bg-gray-50 rounded-lg border border-dashed border-gray-300">No materials added. Click 'Add Item' if you purchased supplies.</p>`;
                materialCount = 0;

                btn.innerHTML = originalBtnHTML;
                btn.disabled = false;

                showToast('Success!', 'Work log & receipt uploaded successfully.', 'success');
            }).submitWorkLog(payload);
        }

        function readFileAsBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
                reader.readAsDataURL(file);
            });
        }

        function showToast(title, desc, type) {
            const toast = document.getElementById('toast-message');
            document.getElementById('toast-title').innerText = title;
            document.getElementById('toast-desc').innerText = desc;

            const icon = document.getElementById('toast-icon');
            icon.className = (type === 'success') ? 'fas fa-check-circle text-green-400 text-2xl' : 'fas fa-exclamation-circle text-red-400 text-2xl';

            toast.classList.remove('translate-y-full', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-y-full', 'opacity-0'), 3500);
        }
    </script>

<script>
    var globalLeases = [];
    var globalTenants = [];

    // Lease Management Functions
    function addTenantRow() {
        const container = document.getElementById('tenants-container');
        document.getElementById('no-tenants-msg').classList.add('hidden');

        const row = document.createElement('div');
        row.className = 'tenant-row flex gap-2 items-center bg-gray-50 p-2 rounded-lg border border-gray-200';
        row.innerHTML = `
            <div class="flex-1">
                <input type="text" placeholder="Tenant Name" class="tenant-name w-full rounded border-gray-300 border p-1.5 text-sm outline-none" required>
            </div>
            <div class="flex-1">
                <input type="text" placeholder="Contact Info (Email/Phone)" class="tenant-contact w-full rounded border-gray-300 border p-1.5 text-sm outline-none" required>
            </div>
            <button type="button" onclick="this.parentElement.remove(); checkTenants();" class="text-red-500 hover:text-red-700 px-2">
                <i class="fas fa-trash"></i>
            </button>
        `;
        container.appendChild(row);
    }

    function checkTenants() {
        const container = document.getElementById('tenants-container');
        if (container.querySelectorAll('.tenant-row').length === 0) {
            document.getElementById('no-tenants-msg').classList.remove('hidden');
        }
    }

    function submitNewLease(e) {
        e.preventDefault();

        const btn = document.getElementById('submit-lease-btn');
        const originalText = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
        btn.disabled = true;

        const tenantRows = document.querySelectorAll('.tenant-row');
        const tenants = [];
        tenantRows.forEach(row => {
            tenants.push({
                name: row.querySelector('.tenant-name').value,
                contactInfo: row.querySelector('.tenant-contact').value
            });
        });

        const payload = {
            propertyId: document.getElementById('lease-property').value,
            startDate: document.getElementById('lease-start-date').value,
            endDate: document.getElementById('lease-end-date').value,
            monthlyRent: document.getElementById('lease-monthly-rent').value,
            securityDeposit: document.getElementById('lease-security-deposit').value,
            tenants: tenants
        };

        google.script.run
            .withSuccessHandler(function(res) {
                btn.innerHTML = originalText;
                btn.disabled = false;
                if (res.success) {
                    showToast("Success", "Lease and tenants added.");
                    document.getElementById('create-lease-form').reset();
                    document.getElementById('tenants-container').innerHTML = '<p id="no-tenants-msg" class="text-sm text-gray-400 italic text-center py-2 bg-gray-50 rounded-lg border border-dashed border-gray-300">No tenants added.</p>';
                    loadLeasesAndTenants();
                } else {
                    showToast("Error", res.error);
                }
            })
            .withFailureHandler(function(err) {
                btn.innerHTML = originalText;
                btn.disabled = false;
                showToast("Error", err.message);
            })
            .addLease(payload);
    }

    function loadLeasesAndTenants() {
        google.script.run
            .withSuccessHandler(function(res) {
                if (res.success) {
                    globalLeases = res.leases || [];
                    globalTenants = res.tenants || [];
                    populateLeaseDropdown();
                }
            })
            .getLeasesAndTenants();
    }

    function populateLeaseDropdown() {
        const select = document.getElementById('ledger-lease-select');
        select.innerHTML = '<option value="">-- Select a Lease --</option>';
        globalLeases.forEach(lease => {
            const opt = document.createElement('option');
            opt.value = lease.leaseId;
            opt.textContent = `${lease.propertyId} (${lease.leaseId})`;
            select.appendChild(opt);
        });
    }

    function updateTenantDropdownAndBalance() {
        const leaseId = document.getElementById('ledger-lease-select').value;
        const tenantSelect = document.getElementById('ledger-tenant-select');
        const balanceDisplay = document.getElementById('lease-balance-display');

        tenantSelect.innerHTML = '<option value="">-- Select Tenant --</option>';

        if (!leaseId) {
            balanceDisplay.classList.add('hidden');
            return;
        }

        const filteredTenants = globalTenants.filter(t => t.leaseId === leaseId);
        filteredTenants.forEach(t => {
            const opt = document.createElement('option');
            opt.value = t.tenantId;
            opt.textContent = t.name;
            tenantSelect.appendChild(opt);
        });

        // Fetch balance
        google.script.run
            .withSuccessHandler(function(res) {
                if(res.success) {
                    balanceDisplay.classList.remove('hidden');
                    document.getElementById('lease-balance-amount').textContent = `$${res.balance.toFixed(2)}`;
                    document.getElementById('balance-expected-rent').textContent = `$${res.expectedRent.toFixed(2)}`;
                    document.getElementById('balance-total-charges').textContent = `$${res.totalCharges.toFixed(2)}`;
                    document.getElementById('balance-total-payments').textContent = `$${res.totalPayments.toFixed(2)}`;
                }
            })
            .calculateLeaseBalance(leaseId);
    }

    function submitLedgerEntry(e) {
        e.preventDefault();

        const btn = document.getElementById('submit-ledger-btn');
        const originalText = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
        btn.disabled = true;

        const nature = document.getElementById('ledger-nature').value;
        const amount = parseFloat(document.getElementById('ledger-amount').value);

        const payload = {
            leaseId: document.getElementById('ledger-lease-select').value,
            tenantId: document.getElementById('ledger-tenant-select').value,
            date: document.getElementById('ledger-date').value,
            transactionType: document.getElementById('ledger-type').value,
            chargeAmount: nature === 'charge' ? amount : 0,
            paymentAmount: nature === 'payment' ? amount : 0
        };

        google.script.run
            .withSuccessHandler(function(res) {
                btn.innerHTML = originalText;
                btn.disabled = false;
                if (res.success) {
                    showToast("Success", "Ledger entry saved.");
                    document.getElementById('ledger-amount').value = '';
                    updateTenantDropdownAndBalance(); // Refresh balance
                } else {
                    showToast("Error", res.error);
                }
            })
            .withFailureHandler(function(err) {
                btn.innerHTML = originalText;
                btn.disabled = false;
                showToast("Error", err.message);
            })
            .recordLedgerEntry(payload);
    }
</script>
