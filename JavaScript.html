        function renderEmployeeHistory(res) {
            if(!res || !res.success) {
                showToast('Error', res ? res.error : 'Failed to load punch history', 'error');
                return;
            }

            userPunchesCache = res.punches || [];

            // Daily Summary Cards
            const summaryContainer = document.getElementById('daily-summary-container');
            summaryContainer.innerHTML = '';
            if(!res.dailySummary || res.dailySummary.length === 0) {
                summaryContainer.innerHTML = '<p class="col-span-full text-center text-gray-400 py-3 text-sm">No daily hours logged yet.</p>';
            } else {
                res.dailySummary.forEach(item => {
                    summaryContainer.insertAdjacentHTML('beforeend', `
                        <div class="bg-gray-50 border border-gray-200 rounded-lg p-3 text-center">
                            <p class="text-xs text-gray-500 font-medium">${item.date}</p>
                            <p class="text-lg font-bold text-blue-600 mt-1">${item.totalHours.toFixed(2)} <span class="text-xs font-normal text-gray-600">hrs</span></p>
                        </div>
                    `);
                });
            }

            // Punch Log List
            const punchesContainer = document.getElementById('punches-list-container');
            punchesContainer.innerHTML = '';
            if(!res.punches || res.punches.length === 0) {
                punchesContainer.innerHTML = '<p class="text-center text-gray-400 py-8 text-sm">No previous punches recorded.</p>';
            } else {
                res.punches.forEach((punch) => {
                    const statusLower = punch.payrollStatus.toLowerCase();
                    let statusClass = 'bg-yellow-100 text-yellow-800 border-yellow-200';
                    if (statusLower === 'approved') statusClass = 'bg-blue-100 text-blue-700 border-blue-200';
                    if (statusLower === 'paid') statusClass = 'bg-green-100 text-green-700 border-green-200';
                    if (statusLower === 'rejected') statusClass = 'bg-red-100 text-red-700 border-red-200';

                    const isPaid = statusLower === 'paid';

                    punchesContainer.insertAdjacentHTML('beforeend', `
                        <div class="p-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 hover:bg-gray-50 transition-colors">
                            <div class="space-y-1">
                                <div class="flex items-center gap-2">
                                    <span class="font-semibold text-gray-900">${punch.propertyId}</span>
                                    <span class="text-xs px-2 py-0.5 rounded-full border font-medium ${statusClass}">${punch.payrollStatus}</span>
                                </div>
                                <p class="text-xs text-gray-600"><span class="font-medium text-gray-800">${punch.taskId}</span> &bull; ${punch.workNotes}</p>
                                <p class="text-xs text-gray-400"><i class="far font-medium fa-calendar mr-1"></i>${punch.dateCompleted}</p>
                            </div>
                            <div class="flex items-center gap-4 w-full sm:w-auto justify-between sm:justify-end border-t sm:border-0 pt-2 sm:pt-0">
                                <span class="font-bold text-gray-800 text-sm">${punch.hoursWorked.toFixed(2)} hrs</span>
                                <button onclick="openEditModal('${punch.workLogId}')" ${isPaid ? 'disabled' : ''} class="text-xs px-3 py-1.5 bg-blue-600 hover:bg-blue-700 disabled:bg-gray-200 disabled:text-gray-400 text-white font-medium rounded-lg shadow-sm transition-colors flex items-center gap-1">
                                    <i class="fas fa-edit"></i> Edit
                                </button>
                            </div>
                        </div>
                    `);
                });
            }
        }

        // --- PAY PERIOD FILTER HELPERS ---
        function setPayPeriodFilter(type) {
            const pStartInput = document.getElementById('payroll-start-date');
            const pEndInput = document.getElementById('payroll-end-date');
            const bStartInput = document.getElementById('billing-start-date');
            const bEndInput = document.getElementById('billing-end-date');
            const now = new Date();

            if (type === 'all') {
                pStartInput.value = '';
                pEndInput.value = '';
                bStartInput.value = '';
                bEndInput.value = '';
            } else if (type === 'current') {
                const dayOfWeek = now.getDay();
                const start = new Date(now);
                start.setDate(now.getDate() - dayOfWeek - 7); // Start of 2-week block
                pStartInput.valueAsDate = start;
                pEndInput.valueAsDate = now;
                bStartInput.valueAsDate = start;
                bEndInput.valueAsDate = now;
            } else if (type === 'previous') {
                const start = new Date(now);
                start.setDate(now.getDate() - 28);
                const end = new Date(now);
                end.setDate(now.getDate() - 14);
                pStartInput.valueAsDate = start;
                pEndInput.valueAsDate = end;
                bStartInput.valueAsDate = start;
                bEndInput.valueAsDate = end;
            }
            loadAdminDashboardData();
        }

            }
        }

                return;
            }

            res.history.forEach(log => {
                const dateLogged = new Date(log.timestamp).toLocaleDateString();
                const startDateStr = log.startDate ? new Date(log.startDate).toLocaleDateString() : 'Beginning';
                const endDateStr = log.endDate ? new Date(log.endDate).toLocaleDateString() : 'End';

                let timePeriod = "All Time";
                if (log.startDate || log.endDate) {
                    timePeriod = startDateStr + " - " + endDateStr;

                historyTbody.insertAdjacentHTML('beforeend', `
                    <tr class="hover:bg-gray-50">

                        <td class="py-3 px-4">${timePeriod}</td>

        function submitRate(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-rate-btn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Saving...';
            btn.disabled = true;

            const payload = {
                rateId: document.getElementById('rate-id').value,
                taskId: document.getElementById('rate-task-id').value.trim(),
                employeeId: document.getElementById('rate-employee-id').value.trim(),
                rate: parseFloat(document.getElementById('rate-amount').value)
            };

            if (payload.rateId) {
                scriptRunner.withSuccessHandler(res => {
                    handleRateResponse(res, btn, originalText);
                }).updateBillingRate(payload);
            } else {
                scriptRunner.withSuccessHandler(res => {
                    handleRateResponse(res, btn, originalText);
                }).addBillingRate(payload);
            }
        }

        function handleRateResponse(res, btn, originalText) {
            btn.innerHTML = originalText;
            btn.disabled = false;
            if (res.success) {
                showToast('Success', res.message, 'success');
                closeRateModal();
                loadRates();
            } else {
                showToast('Error', res.error, 'error');
            }
        }

        function deleteRate(rateId) {
            if (confirm("Are you sure you want to delete this billing rate?")) {
                scriptRunner.withSuccessHandler(res => {
                    if (res.success) {
                        showToast('Success', 'Rate deleted', 'success');
                        loadRates();
                    } else {
                        showToast('Error', res.error, 'error');
                    }
                }).deleteBillingRate(rateId);
            }
        }
        function saveCustomChargeAmount(workLogId, inputEl) {
            const val = inputEl.value;
            // Only update if it's not strictly reverting logic in progress
            if (inputEl.disabled) return;

            scriptRunner.withSuccessHandler(function(res) {
                if(res.success) {
                    showToast('Updated', 'Billable amount saved', 'success');
                    // We can either reload the whole dashboard or just rely on the UI update
                    // loadAdminDashboardData() is heavy, but ensures consistency. Let's load it.
                    loadAdminDashboardData();
                } else {
                    showToast('Error', res.error, 'error');
                }
            }).updateChargeAmount(workLogId, val);
        }

        function revertCustomChargeAmount(workLogId, btnEl, originalAmount) {
            const inputEl = btnEl.previousElementSibling;
            inputEl.value = originalAmount;
            // Trigger save with empty value so it resets on the backend (allowing original logic to take over)
            scriptRunner.withSuccessHandler(function(res) {
                if(res.success) {
                    showToast('Reverted', 'Billable amount reverted to default', 'success');
                    loadAdminDashboardData();
                } else {
                    showToast('Error', res.error, 'error');
                }
            }).updateChargeAmount(workLogId, '');
        }

                if(res.success) {
                    showToast('Updated', res.message, 'success');
                    loadAdminDashboardData();
                } else {
                    showToast('Error', res.error, 'error');
                }
            }).updateApprovalStatus(workLogId, status);
        }

                document.getElementById('link-pdf-url').href = res.pdfUrl;

                // Trigger automatic browser download if base64 data is present
                if(res.base64Pdf) {

        async function executeSubmission() {
            const btn = document.getElementById('submit-btn');
            const originalBtnHTML = btn.innerHTML;
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> <span>Saving & Uploading...</span>`;
            btn.disabled = true;

            const payload = {
                date: document.getElementById('log-date').value,
                propertyId: document.getElementById('log-property').value.trim(),
                taskId: document.getElementById('log-task').value.trim(),
                hours: parseFloat(document.getElementById('log-hours').value),
                notes: document.getElementById('log-notes').value,
                chargeTarget: currentRole === 'admin' ? document.getElementById('log-charge-target').value : 'Owner',
                materials: []
            };

            const materialRows = document.querySelectorAll('[id^="material-row-"]');

            for (var i = 0; i < materialRows.length; i++) {
                const row = materialRows[i];
                const vendor = row.querySelector('.material-vendor').value;
                const desc = row.querySelector('.material-desc').value;
                const cost = parseFloat(row.querySelector('.material-cost').value);
                const fileInput = row.querySelector('.material-file');

                let fileData = null;
                let fileName = null;
                let fileType = null;

                if (fileInput && fileInput.files && fileInput.files[0]) {
                    const file = fileInput.files[0];
                    fileName = file.name;
                    fileType = file.type;
                    fileData = await readFileAsBase64(file);
                }

                payload.materials.push({
                    vendor: vendor,
                    description: desc,
                    cost: cost,
                    fileData: fileData,
                    fileName: fileName,
                    fileType: fileType
                });
            }

            scriptRunner.withSuccessHandler(function(response) {
                document.getElementById('work-log-form').reset();
                document.getElementById('log-date').valueAsDate = new Date();
                bypassPropertyWarning = false;

                document.getElementById('materials-container').innerHTML = `<p id="no-materials-msg" class="text-sm text-gray-400 italic text-center py-2 bg-gray-50 rounded-lg border border-dashed border-gray-300">No materials added. Click 'Add Item' if you purchased supplies.</p>`;
                materialCount = 0;

                btn.innerHTML = originalBtnHTML;
                btn.disabled = false;

                showToast('Success!', 'Work log & receipt uploaded successfully.', 'success');
            }).submitWorkLog(payload);
        }

        function readFileAsBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
                reader.readAsDataURL(file);
            });
        }

    let rtSortCol = -1;
    let rtSortAsc = true;
    function sortRentTracking(colIndex) {
        if (rtSortCol === colIndex) {
            rtSortAsc = !rtSortAsc;
        } else {
            rtSortCol = colIndex;
            rtSortAsc = true;
        }
        renderRentTrackingTable();
    }

    function renderRentTrackingTable() {
        const tbody = document.getElementById('rent-tracking-tbody');
        const ownerFilter = document.getElementById('rt-owner-filter').value.toLowerCase();
        const addressFilter = document.getElementById('rt-address-filter').value.toLowerCase();

        let filteredData = currentRentRollData.filter(r => {
            const matchOwner = !ownerFilter || (r.owner && r.owner.toLowerCase().includes(ownerFilter));
            const matchAddress = !addressFilter || (r.address && r.address.toLowerCase().includes(addressFilter));
            return matchOwner && matchAddress;
        });

        if (rtSortCol !== -1) {
            filteredData.sort((a, b) => {
                let valA, valB;
                if (rtSortCol === 0) { valA = a.property; valB = b.property; }
                else if (rtSortCol === 1) { valA = a.owner; valB = b.owner; }
                else if (rtSortCol === 2) { valA = a.address; valB = b.address; }
                else if (rtSortCol === 3) { valA = a.tenantName; valB = b.tenantName; }

                if (valA < valB) return rtSortAsc ? -1 : 1;
                if (valA > valB) return rtSortAsc ? 1 : -1;
                return 0;
            });
        }

        tbody.innerHTML = '';
        if (filteredData.length === 0) {
            tbody.innerHTML = '<tr><td colspan="17" class="text-center py-4 text-gray-500">No rent data found for criteria.</td></tr>';
            return;
        }

        filteredData.forEach(row => {
            let tr = document.createElement('tr');
            tr.className = "hover:bg-gray-50 transition-colors";

            let html = `
                <td class="p-3 text-gray-800 font-medium">${row.property}</td>
                <td class="p-3 text-gray-600">${row.owner}</td>
                <td class="p-3 text-gray-600">${row.address}</td>
                <td class="p-3 text-gray-800">${row.tenantName}</td>
                <td class="p-3 text-right font-medium text-gray-900">$${(row.expectedRent||0).toFixed(2)}</td>
            `;

            for (var m = 0; m < 12; m++) {
                if (!row.activeMonths[m]) {
                    html += `<td class="p-3 text-center bg-gray-100 text-gray-400 text-xs">-</td>`;
                } else {
                    const paid = row.payments[m] || 0;
                    const expected = row.expectedRent || 0;

                    let bgClass = "bg-red-50 hover:bg-red-100 text-red-700 cursor-pointer border border-red-100"; // Unpaid
                    let icon = `<i class="fas fa-times-circle"></i>`;
                    let diffText = ``;

                    if (paid >= expected && expected > 0) {
                        bgClass = "bg-green-50 hover:bg-green-100 text-green-700 cursor-pointer border border-green-100";
                        icon = `<i class="fas fa-check-circle"></i>`;
                    } else if (paid > 0) {
                        bgClass = "bg-yellow-50 hover:bg-yellow-100 text-yellow-700 cursor-pointer border border-yellow-100";
                        icon = `<i class="fas fa-exclamation-circle"></i>`;
                        diffText = `<br><span class="text-[10px]">-$${(expected-paid).toFixed(2)}</span>`;
                    }

                    const monthName = new Date(currentRentRollYear, m, 1).toLocaleString('default', { month: 'short' });

                    html += `<td class="p-1 text-center">
                        <div class="h-full w-full rounded p-1.5 flex flex-col items-center justify-center ${bgClass}"
                             onclick="openRentPaymentModal('${row.leaseId}', '${row.tenantId}', '${row.property}', '${row.tenantName}', ${m}, ${expected})">
                             <div class="font-medium">$${paid.toFixed(0)}</div>
                             ${diffText}

        function addBulkRow(overrideEntityType = null) {
            const entityType = overrideEntityType || document.getElementById('bulk-entity-type').value;
            const config = BULK_CONFIG[entityType];
            const tbody = document.getElementById('bulk-table-body');
            const row = document.createElement('tr');
            row.className = 'bulk-row hover:bg-gray-50';

            let rowHtml = '';
            config.columns.forEach(col => {
                rowHtml += `<td class="p-2 align-top">`;
                if (col.type === 'select') {
                    rowHtml += `<select data-key="${col.key}" class="w-full rounded border-gray-300 border p-1.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none bg-white">`;
                    col.options.forEach(opt => {
                        rowHtml += `<option value="${opt}" ${opt === col.default ? 'selected' : ''}>${opt}</option>`;
                    });
                    rowHtml += `</select>`;
                } else {
                    const stepMin = col.type === 'number' ? `step="${col.step}" min="${col.min}"` : '';
                    rowHtml += `<input type="${col.type}" data-key="${col.key}" data-required="${col.required}" ${stepMin} class="w-full rounded border-gray-300 border p-1.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none bg-white placeholder-gray-400">`;
                }
                rowHtml += `</td>`;
            });
            // delete row button
            rowHtml += `<td class="p-2 align-top text-center"><button type="button" onclick="this.closest('tr').remove()" class="text-red-500 hover:text-red-700 mt-1"><i class="fas fa-trash"></i></button></td>`;
            row.innerHTML = rowHtml;
            tbody.appendChild(row);
        }

        function submitBulkAdd(e) {
            e.preventDefault();
            const entityType = document.getElementById('bulk-entity-type').value;
            const config = BULK_CONFIG[entityType];
            const rows = document.querySelectorAll('#bulk-table-body .bulk-row');
            const payloads = [];
            let hasError = false;

            // Clear previous errors
            document.querySelectorAll('.bulk-row input, .bulk-row select').forEach(el => el.classList.remove('border-red-500', 'bg-red-50'));

            rows.forEach(row => {
                const inputs = row.querySelectorAll('input, select');
                const rowData = {};
                let isRowEmpty = true;
                let isRowMissingRequired = false;

                // Pass 1: check if row is empty and collect data
                inputs.forEach(input => {
                    const key = input.getAttribute('data-key');
                    const val = input.value.trim();
                    if (input.tagName === 'INPUT' && val !== '') {
                        isRowEmpty = false;
                    }
                    rowData[key] = val;
                });

                // Pass 2: validate required fields only if row is not empty
                if (!isRowEmpty) {
                    inputs.forEach(input => {
                        const isRequired = input.getAttribute('data-required') === 'true';
                        const val = input.value.trim();
                        if (isRequired && val === '') {
                            isRowMissingRequired = true;
                            input.classList.add('border-red-500', 'bg-red-50');
                        }
                    });

                    if (isRowMissingRequired) {
                        hasError = true;
                    } else {
                        // For tasks, convert string to boolean for isBillable
                        if (entityType === 'tasks' && 'isBillable' in rowData) {
                             rowData.isBillable = rowData.isBillable === 'Yes';
                        }
                        payloads.push(rowData);
                    }
                }
            });

            if (hasError) {
                showToast("Please fill in all required fields for non-empty rows.", "error");
                return;
            }

            if (payloads.length === 0) {
                showToast("No data to save.", "warning");
                return;
            }

            const btn = document.getElementById('submit-bulk-btn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
            btn.disabled = true;

            let functionName = '';
            if (entityType === 'rates') functionName = 'addBillingRatesBulk';
            if (entityType === 'properties') functionName = 'addPropertiesBulk';
            if (entityType === 'employees') functionName = 'addEmployeesBulk';
            if (entityType === 'tasks') functionName = 'addTasksBulk';

            scriptRunner.run(functionName, payloads).then(res => {
                btn.innerHTML = originalText;
                btn.disabled = false;
                if (res.success) {
                    showToast(res.message, 'success');
                    closeBulkAddModal();
                    if (entityType === 'rates') loadSettings();
                    if (entityType === 'properties') loadSettings();
                    if (entityType === 'employees') loadSettings();
                    if (entityType === 'tasks') loadSettings();
                } else {
                    showToast("Error: " + res.error, 'error');
                }
            }).catch(err => {
                btn.innerHTML = originalText;
                btn.disabled = false;
                showToast("Connection error.", "error");
            });
        }
